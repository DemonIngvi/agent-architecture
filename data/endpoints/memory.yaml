GET /context:
  request: 'query: issueId, agentId'
  response: '200 · {m1: UserMessage[], m2: RunSummary[], m3: M3Record, m5, m6}'
  note: 'по профилю памяти агента; ошибки: 403 — область записи («команда» и др.) вне доступа агента, запрос отклонён и попал в аудит (R-MEM-02); 400 — нет `issueId` или `agentId`'
PUT /m3/:issueId:
  request: M3Record
  response: 200 · M3Record (новая version)
  note: 'ошибки: 409 — запись изменилась (конкурентная запись); 403 — уровень не разрешён профилем или область чужая (R-MEM-15, R-MEM-02); 422 — секрет в записи или запись больше `m3_max_kb`: причина и граница в ответе (R-MEM-15)'
DELETE /records/:level/:id:
  request: —
  response: '204'
  note: 'ошибки: 403 — у участника нет права удалять запись (R-MEM-07); 404 — записи нет'
POST /retention/run:
  request: —
  response: '200 · {deleted: {m3}}'
  note: CronJob; ошибка — записи остаются, M3 закрытых задач не отдаётся в контекст, уведомление эксплуатации, задание повторяется (FMEA «Очистка M3 не прошла»); M4 — после MVP; M1 и M2 в таблицах форка не удаляет — фильтр чтения, строки удаляет ICPlan (D25)
