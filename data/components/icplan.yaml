specs:
- {label: Registry — спека, path: openspec/changes/define-agent-platform/specs/agent-registry/spec.md}
- {label: Registry — схема, path: openspec/changes/define-agent-platform/specs/agent-registry/architecture.md}
- {label: Интеграция — proposal, path: openspec/changes/add-icplan-integration/proposal.md}
- {label: Интеграция — спека, path: openspec/changes/add-icplan-integration/specs/icplan-integration/spec.md}
- {label: Интеграция — схема и user flow, path: openspec/changes/add-icplan-integration/specs/icplan-integration/architecture.md}
- {label: Автоподхват — proposal, path: openspec/changes/icplan-agent-autopickup/proposal.md}
- {label: Автоподхват — спека, path: openspec/changes/icplan-agent-autopickup/specs/icplan-agent-autopickup/spec.md}
- {label: Автоподхват — схема, path: openspec/changes/icplan-agent-autopickup/specs/icplan-agent-autopickup/architecture.md}
tasks: ['1.2', '2.3', '3.1', '3.2', '3.4', '3.5', '3.6', '3.7', '3.8', '3.9']
about:
  chain:
  - {label: Пользователь}
  - {label: ICPlan, comp: icplan}
  - {label: Agent Runner, comp: agent-runner}
  purpose: 'Рабочее место людей: задачи, доска и процесс. Отсюда агенты получают работу и сюда возвращают результат.'
  does:
  - Доска и статусы — процесс, который пользователь настраивает сам
  - Настройка агентов (Control Plane UI) и их каталог (Registry)
  - 'Процесс задачи: шаг = колонка + агент + переход по итогу запуска (D17) — доработка'
  - Очередь запусков и протокол внешнего раннера
  - Показ хода работы агента, approve и затрат в задаче
stores: [S1, S7]
icplan_tables:
- {key: project, note: ''}
- {key: projectColumn, note: ''}
- {key: issueType, note: ''}
- {key: issue, note: + `review_with_me` (D17)}
- {key: issueChecklist, note: ''}
- {key: issueChecklistItem, note: '+ `origin`, `status` (D20)'}
- {key: issueActivity, note: ''}
- {key: aiAgent, note: + `enabled` (D17)}
- {key: agentRun, note: ''}
- {key: agentSchedule, note: ''}
- {key: agentChatThread, note: ''}
- {key: agentChatMessage, note: ''}
- {key: projectAction, note: + ключ `delegateUserId` в `effect` (R-AP-03)}
- {key: projectDocument, note: ''}
- {key: issueAttachment, note: ''}
- {key: user, note: Better Auth; у агента — бот-пользователь}
- {key: apikey, note: 'ключ агента: Bearer для I1–I3; `reference_id` → `user.id`'}
blocks:
- - {title: Пользователь, desc: 'задачи, доска, чат', kind: user}
  - {title: Администратор, desc: 'агенты, процесс', kind: user}
- ↓ работает с задачами · настраивает ↓
- zone: ICPlan
  rows:
  - - {title: Task UI, desc: 'доска, статусы, комментарии, чат агента; нужны чат запуска, approve, затраты', kind: core, st: part}
    - {title: Control Plane UI, desc: 'настройка агента: модель, инструкция, тулы, навыки, MCP, проекты', kind: core, st: done}
  - ↓ статус / делегат задачи · сохранение настроек ↓
  - - {title: Автоподхват, desc: 'процесс типа задачи: шаг = колонка + агент + переход по итогу (D17)', kind: core, st: todo}
    - {title: Registry, desc: 'агенты, тулы, навыки, ключи; версии и YAML — Platform module (D9, D26)', kind: core, st: part}
  - ↓ запуск
  - - {title: Run Queue + runner API, desc: 'очередь запусков, протокол внешнего раннера, стрим', kind: core, st: part}
    - {title: MCP itsaplan-core, desc: весь REST API ICPlan как тулы агента, kind: core, st: done}
    - {title: БД ICPlan (Postgres), desc: 'база `itsaplan`: задачи, агенты, запуски, M1, M2; M3 — схема `memory` (Memory API, D22)', kind: store, st: done}
  - встроены в api ICPlan (HOST)
  - - {title: Platform module, desc: 'встроен: наши настройки, схема `platform`', kind: ext, to: platform-module}
    - {title: Observability, desc: 'встроен: события → чат запуска', kind: ext, to: observability}
  cls: icplan
- ↓ запуск из очереди · стрим и итог ↑
- - {title: Agent Runner, desc: исполняет запуск, kind: ext, to: agent-runner}
