title: git-провайдер
tech: MCP-сервер git-провайдера (Gitea или GitHub — провайдер выбирается в задаче 4.2)
kind: service
stories: [US-MCP-01, US-MCP-02, US-SBX-02]
params:
- [servers, 'подключается к агенту, которому нужен код; по умолчанию — только itsaplan-core']
- [tools, 'allowlist: branch, commit, pr.create']
- [timeout_s, '30']
- [auth.secret_ref, 'ссылка на Secret с учётными данными сервера; значение не хранится в настройках']
does:
- 'Создаёт ветку, коммит и PR; агент отдаёт код через PR, прямого push нет'
- Запись — только в ветку с префиксом агента; push в защищённую ветку отклоняется
- Учётные данные держит MCP-сервер и MCP-прокси Runner, в sandbox и контекст агента они не попадают
io:
- [←, MCP-прокси Agent Runner, '`McpToolCall`: `tools/list`, `tools/call` (I9)']
- [→, «git-провайдер», 'вызов API провайдера с короткоживущим токеном от Runner (I18)']
- [→, Harness, 'ссылка на ветку и PR для `RunResult`']
data:
- [project_resource, 'чтение через I4: репозитории проекта (`kind = git`) и MCP-серверы агента (`kind = mcp`, владелец Platform module)']
- [access_policy, 'чтение через I4: права агента на репозитории и ветки (владелец Platform module)']
reqs: [R-MCP-01, R-MCP-02, R-MCP-03, R-MCP-04, R-MCP-09, R-SBX-04]
tasks: ['4.2']
failures:
- Провайдер недоступен — ошибка тула агенту, цикл продолжается; чтение повторяется 2 раза, запись — нет (FMEA «MCP-сервер недоступен», R-MCP-09)
- Секрет сервера не задан — тулы сервера недоступны агенту, предупреждение (FMEA «Секрет MCP не задан»)
- Тул вне allowlist — вызов отклонён MCP-прокси без обращения к серверу (R-MCP-02 «Тул вне списка»)
- Репозиторий вне манифеста запуска или защищённая ветка — токен не выдан, запись отклонена (R-SBX-04)
- Ответ длиннее `max_result_kb` — обрезается с пометкой (R-MCP-03 «Большой ответ»)
why: Агент-разработчик отдаёт код через PR, без прямого push. Тул нужен нескольким агентам и держит секрет вне агента — значит MCP-сервер (R3, R-MCP-04).
rnd: mcp-vs-direct.md
ops:
- ['`tools/list` — тулы git-провайдера, отфильтрованные allowlist запуска', MCP-прокси Runner, I9]
- ['`tools/call` `branch` — создать ветку с префиксом агента', Harness через MCP-прокси Runner, I9]
- ['`tools/call` `commit` — зафиксировать изменения в ветке агента', Harness через MCP-прокси Runner, I9]
- ['`tools/call` `pr.create` — открыть PR из ветки агента; ссылка попадает в `RunResult`', Harness через MCP-прокси Runner, I9]
