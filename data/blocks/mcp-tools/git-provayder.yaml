title: git-провайдер
tech: MCP-сервер git-провайдера (Gitea или GitHub — провайдер выбирается в задаче 4.2)
kind: service
stories: [US-MCP-01, US-MCP-02, US-SBX-02]
params:
- {name: servers, value: 'подключается к агенту, которому нужен код; по умолчанию — только itsaplan-core'}
- {name: tools, value: 'allowlist: branch, commit, pr.create'}
- {name: timeout_s, value: '30'}
- {name: auth.secret_ref, value: ссылка на Secret с учётными данными сервера; значение не хранится в настройках}
does:
- Создаёт ветку, коммит и PR; агент отдаёт код через PR, прямого push нет
- Запись — только в ветку с префиксом агента; push в защищённую ветку отклоняется
- Учётные данные держит MCP-сервер и MCP-прокси Runner, в sandbox и контекст агента они не попадают
io:
- {dir: ←, with: MCP-прокси Agent Runner, model: [McpToolCall], what: '`McpToolCall`: `tools/list`, `tools/call`', via: [I9]}
- {dir: →, with: «git-провайдер», what: вызов API провайдера с короткоживущим токеном от Runner, via: [I18]}
- {dir: →, with: Harness, model: [RunResult], what: ссылка на ветку и PR для `RunResult`}
data:
- {table: project_resource, access: read, via: [I4], why: 'репозитории проекта (`kind = git`) и MCP-серверы агента (`kind = mcp`, владелец Platform module)'}
- {table: access_policy, access: read, via: [I4], why: права агента на репозитории и ветки (владелец Platform module)}
reqs: [R-MCP-01, R-MCP-02, R-MCP-03, R-MCP-04, R-MCP-09, R-SBX-04]
tasks: ['4.2']
failures:
- {when: Провайдер недоступен, then: 'ошибка тула агенту, цикл продолжается; чтение повторяется 2 раза, запись — нет (FMEA «MCP-сервер недоступен», R-MCP-09)', reqs: [R-MCP-09]}
- {when: Секрет сервера не задан, then: 'тулы сервера недоступны агенту, предупреждение (FMEA «Секрет MCP не задан»)'}
- {when: Тул вне allowlist, then: вызов отклонён MCP-прокси без обращения к серверу (R-MCP-02 «Тул вне списка»), reqs: [R-MCP-02]}
- {when: Репозиторий вне манифеста запуска или защищённая ветка, then: 'токен не выдан, запись отклонена', reqs: [R-SBX-04]}
- {when: Ответ длиннее `max_result_kb`, then: обрезается с пометкой (R-MCP-03 «Большой ответ»), reqs: [R-MCP-03]}
why: Агент-разработчик отдаёт код через PR, без прямого push. Тул нужен нескольким агентам и держит секрет вне агента — значит MCP-сервер (R3, R-MCP-04).
rnd: mcp-vs-direct.md
ops:
- {op: '`tools/list` — тулы git-провайдера, отфильтрованные allowlist запуска', who: MCP-прокси Runner, via: [I9]}
- {op: '`tools/call` `branch` — создать ветку с префиксом агента', who: Harness через MCP-прокси Runner, via: [I9]}
- {op: '`tools/call` `commit` — зафиксировать изменения в ветке агента', who: Harness через MCP-прокси Runner, via: [I9]}
- {op: '`tools/call` `pr.create` — открыть PR из ветки агента; ссылка попадает в `RunResult`', who: Harness через MCP-прокси Runner, via: [I9]}
