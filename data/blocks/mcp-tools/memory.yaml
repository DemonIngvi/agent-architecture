title: memory
tech: Нативный тул Harness (R4), запись M3 через Memory API
kind: service
stories: [US-MEM-01, US-HAR-01]
params:
- [tools, 'тул памяти — нативный, в allowlist MCP не входит; уровень записи M3 задаёт профиль памяти агента']
- [servers, 'MCP-сервер не нужен — тул встроен в Harness']
does:
- Записывает состояние задачи M3 (сделано, дальше, блокеры; передача следующему — артефакты, вопросы, критерии, D20)
- Проверки записи делает Memory (профиль, область, схема, размер, секреты); тулу возвращается причина отказа
- Используется только Harness, поэтому не MCP-сервер (R4, R-MCP-04)
io:
- [←, Harness · Tool Executor, 'вызов тула памяти с `M3Record`']
- [→, Memory API, '`M3Record` — запись M3 (I11, `PUT /m3/:issueId`)']
data:
- [memory_m3, 'запись через Memory API (I11, владелец — Memory); тул в БД не ходит']
reqs: [R-MEM-04, R-MEM-15, R-MCP-04]
tasks: ['2.5']
failures:
- Memory API недоступен — тулу возвращается ошибка, запуск продолжается; запись M3 повторяется в конце (FMEA agent-harness; R-MEM-04)
- Запись больше `m3_max_kb` или с секретом — отклонена с причиной, агент исправляет или продолжает без записи (R-MEM-15)
- Два запуска пишут M3 одновременно — сохраняется последняя версия, прежняя остаётся в истории (R-MEM-04 «Конфликт записи»)
why: Используется только Harness — MCP не нужен, лишний прыжок и описания тула в контексте (R4).
rnd: mcp-vs-direct.md
ops:
- ['тул памяти: запись `M3Record` — `PUT /m3/:issueId` (Memory API)', Harness · Tool Executor, I11]
