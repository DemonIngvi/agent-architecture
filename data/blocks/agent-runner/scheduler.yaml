title: Scheduler
tech: Go + таблица слотов `scheduler_slot` в схеме `runner` (вариант B, D14, D22)
kind: service
stories: [US-RUN-02, US-RUN-03, US-RUN-04, US-RUN-05]
params:
- {name: scheduling.mode, value: parallel}
- {name: scheduling.global_max, value: '4'}
- {name: scheduling.per_issue, value: '1'}
- {name: scheduling.models.<alias>.max, value: '3'}
- {name: scheduling.agents.<id>.parallel / max, value: нет / 1}
- {name: concurrency, value: '1'}
- {name: scheduling.order, value: fifo}
- {name: scheduling.aging_s, value: '600'}
does:
- 'Стартует запуск, только когда свободны все слоты: глобальный, агента, модели, задачи'
- Держит запуск в `queued` с причиной ожидания; порядок `fifo` или `priority` со старением `scheduling.aging_s`
- Общие слоты для нескольких Runner через Postgres
- Освобождает глобальный и модельный слоты на время `waiting_approval`
io:
- {dir: ←, with: Poller, model: [Run], what: '`Run` в `queued`'}
- {dir: →, with: Admission, what: 'запуск, получивший слоты'}
- {dir: ←, with: Event relay, what: '`waiting_approval` и решение по approve'}
- {dir: ↔, with: Postgres, what: слоты `scheduler_slot`, via: [I22]}
data:
- {table: scheduler_slot, access: read-write, why: слоты и аренды}
reqs: [R-RUN-02, R-RUN-03, R-RUN-04, R-RUN-05, R-RUN-06, R-RUN-11, R-RUN-12]
tasks: ['2.7']
failures:
- {when: Таблица слотов недоступна, then: 'новые запуски не стартуют (fail-closed), активные продолжаются; после восстановления слоты пересчитываются по активным запускам (R-RUN-06, FMEA «Postgres платформы»)', reqs: [R-RUN-06]}
- {when: Экземпляр Runner упал с занятыми слотами, then: слоты освобождаются по истечении аренды `lease_until`, reqs: [R-RUN-06]}
- {when: Конфиг `scheduling` вне границ, then: 'значение отклоняется с именем параметра и границами, без обязательных параметров Runner не стартует', reqs: [R-RUN-11]}
why: Учитывает общие модели и агентов, которые нельзя параллелить; режим платформы — одной настройкой.
rnd: runner-and-scheduling.md
ops:
- {op: 'занять слоты запуска — глобальный, агента, модели, задачи — одной транзакцией в `scheduler_slot` с арендой `lease_until`', who: Poller после claim; Event relay после решения по approve, internal: true}
- {op: 'освободить глобальный слот и слот модели при `waiting_approval`, слот задачи держать', who: Event relay, internal: true, reqs: [R-RUN-04]}
- {op: забрать просроченные аренды слотов упавшего экземпляра, who: Scheduler по `lease_until`, internal: true}
- {op: причина ожидания («ждёт слот модели») — в события запуска, who: Scheduler → Event relay, internal: true}
