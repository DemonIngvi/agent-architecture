title: Finalizer
tech: Go
kind: service
stories: [US-RUN-01, US-ICP-04]
params:
- {name: pool.size, value: '2'}
does:
- Пишет итог в задачу, частичный — с пометкой «не завершено» (R-RUN-08)
- Освобождает слоты
- Уничтожает контейнер после любого терминального статуса, пул доливается (R-RUN-10)
io:
- {dir: ←, with: Run supervisor, what: '`RunResult` или причина остановки'}
- {dir: →, with: ICPlan, model: [RunResult], via: [I2]}
- {dir: →, with: RustFS, what: вложения, via: [I19]}
- {dir: →, with: Sandbox, what: destroy, via: [I6]}
- {dir: →, with: Scheduler, what: освобождённые слоты}
data:
- {table: agent_run, access: write, via: [I2], why: 'итог (таблица ICPlan, M2 пишет ICPlan)'}
- {table: scheduler_slot, access: write, why: освобождение слотов}
reqs: [R-RUN-07, R-RUN-08, R-RUN-10, R-SBX-02, R-ICP-13]
tasks: ['2.1', '2.2', '2.6']
failures:
- {when: Контейнер не удалился, then: 'повтор удаления (destroy идемпотентен), событие; слот не занимается', reqs: [R-RUN-10]}
- {when: ICPlan не принял итог, then: повтор отправки; переход задачи — когда итог принят, reqs: [R-ICP-13]}
- {when: Итог не по формату определения, then: '`gate_failed` или пометка несоответствия', reqs: [R-RUN-08]}
- {when: RustFS недоступно, then: повтор 3 раза (I19); сценарий отказа итога — задача 2.6.6}
why: Каждый запуск заканчивается чисто, без хвостов.
rnd: sandbox-isolation.md
ops:
- {op: 'итог `RunResult`, терминальный статус', endpoint: 'POST /agent-runs/:runId/result', who: Finalizer, via: [I2]}
- {op: вложения итога в объектное хранилище (S3 API), who: Finalizer, via: [I19]}
- {op: '`SandboxProvider.destroy` и долив пула', who: Finalizer, via: [I6]}
- {op: освободить слоты запуска в `scheduler_slot`, who: Finalizer, internal: true}
