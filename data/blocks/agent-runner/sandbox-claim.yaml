title: Sandbox claim
tech: 'Клиент `SandboxProvider` компонента Sandbox (D1): Docker сейчас, K8s на этапе 4'
kind: service
stories: [US-SBX-01, US-RUN-01]
params:
- {name: pool.size, value: '2'}
- {name: provider, value: docker}
does:
- Берёт готовый контейнер профиля агента из тёплого пула через `SandboxProvider`; пул пуст — контейнер создаётся, запуск ждёт его старта (R-SBX-02)
- 'Пулом не владеет: пул — часть компонента Sandbox (блоки «Тёплый пул», «SandboxProvider», задача 4.1); на этапах 1–3 контейнеры пула живут в rootless Docker узла, на этапе 4 — `SandboxWarmPool` agent-sandbox в K8s'
- 'Вызывается только после слотов Scheduler и допуска G1: пул слотов не занимает, слот занимает запуск; `pool.size` не больше `scheduling.global_max`'
io:
- {dir: ←, with: Admission, what: допущенный запуск}
- {dir: →, model: [SandboxClaim, RepoGrant], what: '`SandboxClaim`, `RepoGrant` (I6; этап 4 — I23)', via: [I6, I23], with: Sandbox (SandboxProvider)}
- {dir: →, with: Шаг подготовки, what: контейнер запуска}
- {dir: →, with: Run supervisor, what: адрес среды}
data:
- {table: sandbox_profile, access: read, via: [I4], why: профиль агента (владелец Platform module)}
reqs: [R-SBX-01, R-SBX-02, R-SBX-11, R-RUN-14, R-RUN-13]
tasks: ['2.2', '4.1']
failures:
- {when: Docker или пул недоступен, then: 'запуск остаётся в `queued`, повтор, событие оператору (FMEA «Docker / пул недоступен», R-RUN-14)', reqs: [R-RUN-14]}
- {when: Пул пуст, then: 'контейнер создаётся на лету, старт дольше (R-SBX-02 «Пул пуст»)', reqs: [R-SBX-02]}
- {when: Образ профиля недоступен, then: 'профиль помечен недоступным, запуски отклоняются', reqs: [R-SBX-11]}
- {when: Сбой сети при `create`, then: 'автоматического повтора нет: create неидемпотентен, решает Run supervisor (R-RUN-13 «Неидемпотентный вызов I6»)', via: [I6], reqs: [R-RUN-13]}
why: Старт < 1 с без потери изоляции; пул за `SandboxProvider` меняется на K8s без переделки Runner (D1).
rnd: sandbox-isolation.md
ops:
- {op: '`SandboxProvider.claim` — готовый контейнер профиля агента из тёплого пула; пул пуст — `create`', who: Admission после допуска, via_note: I6 (этап 4 — I23)}
- {op: 'передать контейнеру манифест рабочего пространства и правила git-прокси (`SandboxClaim`, `RepoGrant`)', who: Sandbox claim, via: [I6]}
