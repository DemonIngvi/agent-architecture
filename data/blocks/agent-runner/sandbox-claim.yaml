title: Sandbox claim
tech: 'Клиент `SandboxProvider` компонента Sandbox (D1): Docker сейчас, K8s на этапе 4'
kind: service
stories: [US-SBX-01, US-RUN-01]
params:
- [pool.size, '2']
- [provider, docker]
does:
- Берёт готовый контейнер профиля агента из тёплого пула через `SandboxProvider`; пул пуст — контейнер создаётся, запуск ждёт его старта (R-SBX-02)
- 'Пулом не владеет: пул — часть компонента Sandbox (блоки «Тёплый пул», «SandboxProvider», задача 4.1); на этапах 1–3 контейнеры пула живут в rootless Docker узла, на этапе 4 — `SandboxWarmPool` agent-sandbox в K8s'
- 'Вызывается только после слотов Scheduler и допуска G1: пул слотов не занимает, слот занимает запуск; `pool.size` не больше `scheduling.global_max`'
io:
- [←, Admission, допущенный запуск]
- [→, Sandbox (SandboxProvider), '`SandboxClaim`, `RepoGrant` (I6; этап 4 — I23)']
- [→, Шаг подготовки, контейнер запуска]
- [→, Run supervisor, адрес среды]
data:
- [sandbox_profile, 'чтение через I4: профиль агента (владелец Platform module)']
reqs: [R-SBX-01, R-SBX-02, R-SBX-11, R-RUN-14]
tasks: ['2.2', '4.1']
failures:
- Docker или пул недоступен — запуск остаётся в `queued`, повтор, событие оператору (FMEA «Docker / пул недоступен», R-RUN-14)
- Пул пуст — контейнер создаётся на лету, старт дольше (R-SBX-02 «Пул пуст»)
- Образ профиля недоступен — профиль помечен недоступным, запуски отклоняются (R-SBX-11)
- 'Сбой сети при `create` — автоматического повтора нет: create неидемпотентен, решает Run supervisor (R-RUN-13 «Неидемпотентный вызов I6»)'
why: Старт < 1 с без потери изоляции; пул за `SandboxProvider` меняется на K8s без переделки Runner (D1).
rnd: sandbox-isolation.md
ops:
- ['`SandboxProvider.claim` — готовый контейнер профиля агента из тёплого пула; пул пуст — `create`', Admission после допуска, I6 (этап 4 — I23)]
- ['передать контейнеру манифест рабочего пространства и правила git-прокси (`SandboxClaim`, `RepoGrant`)', Sandbox claim, I6]
