title: Шаг подготовки
tech: Контейнер подготовки в сети `sbx-setup` (D19), кэш `setup_cache` в схеме `runner`
kind: service
stories: [US-SBX-05]
params:
- {name: setup.script, value: нет}
- {name: setup.cache_ttl_h, value: '168'}
- {name: setup.timeout_s, value: '600'}
does:
- Ставит зависимости проекта до старта агента
- Кэширует по хешу lock-файлов в /workspace/.deps; кэш моложе `setup.cache_ttl_h` — шаг пропускается
- Повторяет установку по тулу install_dependencies
io:
- {dir: ←, with: Sandbox claim, what: контейнер запуска}
- {dir: ←, with: Harness, what: '`POST /runs/:runId/deps`', via: [I7]}
- {dir: →, with: Sandbox, what: контейнер подготовки, via: [I6]}
data:
- {table: setup_cache, access: read-write, why: кэш по хешу lock-файлов}
- {table: project_platform, access: read, via: [I4], why: '`setup_script`, `lock_files` (владелец Platform module)'}
reqs: [R-SBX-14, R-HRN-17]
tasks: ['4.2']
failures:
- {when: Скрипт упал или превысил `setup.timeout_s`, then: запуск `failed` с причиной «подготовка среды» (FMEA)}
- {when: Повтор по `install_dependencies` не удался, then: 'ответ `{status: failed, log}`, агент получает ошибку тула'}
why: Агенту нужны зависимости для тестов, а доступ к реестрам — канал утечки; поэтому реестры только у подготовки.
rnd: agent-workspace.md
ops:
- {op: 'выполнить `setup.script` в контейнере подготовки, результат — в `/workspace/.deps`', label: Run supervisor до старта Harness при промахе кэша, via: [I6]}
- {op: повтор шага подготовки (тул `install_dependencies`), endpoint: 'POST /runs/:runId/deps', label: 'Harness, токен запуска', via: [I7]}
