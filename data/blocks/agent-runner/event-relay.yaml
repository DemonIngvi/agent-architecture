title: Event relay
tech: Go, поток `RunEvent` (NDJSON, AG-UI — D21)
kind: service
stories: [US-OBS-01, US-RUN-04, US-ICP-10]
params:
- {name: events.level, value: всё}
does:
- Передаёт шаги Harness в ICPlan (таблица событий Observability) с дедупликацией по (run_id, seq)
- Передаёт решение человека и указания обратно в Harness
- Сообщает Scheduler о `waiting_approval` и решении — для освобождения и повторного занятия слотов
io:
- {dir: ←, with: Harness, model: [RunEvent], via: [I7]}
- {dir: →, with: ICPlan, model: [RunEvent], via: [I2]}
- {dir: ←, with: ICPlan, what: '`ApprovalDecision`, `UserMessage` в ответе heartbeat', via: [I3]}
- {dir: →, with: Harness, model: [ApprovalDecision, UserMessage], via: [I7]}
- {dir: →, with: Scheduler, what: '`waiting_approval`, решение'}
data:
- {table: run_event, access: write, via: [I2], why: '(владелец Observability), напрямую не пишет'}
- {table: agent_run_delivery, why: 'через I3: подтверждение доставки решений и указаний (таблица ICPlan)'}
reqs: [R-ICP-04, R-ICP-16, R-RUN-07, R-RUN-04, R-OBS-01, R-HRN-06]
tasks: ['2.1', '3.3']
failures:
- {when: ICPlan не принимает события, then: 'буфер в памяти Runner, досылка по `seq` без дублей (FMEA «ICPlan недоступен», I2)'}
- {when: Поток Harness оборвался, then: переподключение с последнего `seq`, via: [I7]}
- {when: Runner перезапущен, then: 'статусы активных запусков восстанавливаются, ICPlan получает актуальный статус без дублей', reqs: [R-RUN-07]}
why: Один канал для чата запуска, approve и аудита.
rnd: observability.md
ops:
- {op: '`GET /run/events?seq=` — поток событий Harness, переподключение с последнего `seq`', who: Event relay, via: [I7]}
- {op: пакеты `RunEvent` с `seq`; смена статуса запуска, endpoint: 'POST /agent-runs/:runId/events', who: Event relay, via: [I2]}
- {op: '`POST /run/approval`, `POST /run/message` — решения и указания из ответа heartbeat', who: Event relay, via: [I7]}
