title: Event relay
tech: Go, поток `RunEvent` (NDJSON, AG-UI — D21)
kind: service
stories: [US-OBS-01, US-RUN-04, US-ICP-10]
params:
- [events.level, всё]
does:
- Передаёт шаги Harness в ICPlan (таблица событий Observability) с дедупликацией по (run_id, seq)
- Передаёт решение человека и указания обратно в Harness
- Сообщает Scheduler о `waiting_approval` и решении — для освобождения и повторного занятия слотов
io:
- [←, Harness, '`RunEvent` (I7)']
- [→, ICPlan, '`RunEvent` (I2)']
- [←, ICPlan, '`ApprovalDecision`, `UserMessage` в ответе heartbeat (I3)']
- [→, Harness, '`ApprovalDecision`, `UserMessage` (I7)']
- [→, Scheduler, '`waiting_approval`, решение']
data:
- [run_event, 'запись через I2 (владелец Observability), напрямую не пишет']
- [agent_run_delivery, 'через I3: подтверждение доставки решений и указаний (таблица ICPlan)']
reqs: [R-ICP-04, R-ICP-16, R-RUN-07, R-RUN-04, R-OBS-01, R-HRN-06]
tasks: ['2.1', '3.3']
failures:
- ICPlan не принимает события — буфер в памяти Runner, досылка по `seq` без дублей (FMEA «ICPlan недоступен», I2)
- Поток Harness оборвался — переподключение с последнего `seq` (I7)
- Runner перезапущен — статусы активных запусков восстанавливаются, ICPlan получает актуальный статус без дублей (R-RUN-07)
why: Один канал для чата запуска, approve и аудита.
rnd: observability.md
ops:
- ['`GET /run/events?seq=` — поток событий Harness, переподключение с последнего `seq`', Event relay, I7]
- ['`POST /agent-runs/:runId/events` — пакеты `RunEvent` с `seq`; смена статуса запуска', Event relay, I2]
- ['`POST /run/approval`, `POST /run/message` — решения и указания из ответа heartbeat', Event relay, I7]
