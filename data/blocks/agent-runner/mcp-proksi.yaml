title: MCP-прокси
tech: Go, официальный MCP Go SDK (D19)
kind: service
stories: [US-MCP-05, US-SBX-03]
params:
- [servers, itsaplan-core]
- [tools, 'минимальный (чтение задачи, комментарий)']
- [auth.secret_ref, — (обязательный)]
does:
- Отдаёт агенту только разрешённые тулы
- 'Проверяет каждый вызов вне sandbox: allowlist манифеста и G2 в OPA'
- Подставляет учётные данные MCP-сервера из Secret по `auth.secret_ref`
io:
- [←, Harness, '`McpToolCall` (I9)']
- [→, Guardrails (OPA), '`PolicyInput` → `PolicyDecision` (I10)']
- [→, MCP itsaplan-core в api ICPlan, '`McpToolCall` (I24)']
- [→, Event relay, решение G2 с причиной]
data:
- [project_resource, 'чтение через I4: MCP-серверы агента (`kind = mcp`, владелец Platform module)']
- [run_event, 'запись через I2: решения G2 (владелец Observability)']
reqs: [R-MCP-02, R-MCP-03, R-RUN-13, R-GRD-03]
tasks: ['2.1']
failures:
- Тул вне allowlist — вызов отклонён без обращения к серверу, решение G2 с причиной в событиях (R-RUN-13 «MCP-прокси запуска»)
- MCP-сервер недоступен — агент получает ошибку тула, цикл продолжается; чтение повторяется 2 раза, запись — нет (FMEA «MCP-сервер недоступен», I9)
- OPA не ответила — решение по `on_engine_error` (deny)
why: Проверка внутри sandbox обходится кодом агента; Runner уже знает манифест, токен и подтверждения.
rnd: mcp-vs-direct.md
ops:
- ['`POST /runs/:runId/mcp/:server` — `tools/list` с фильтром по allowlist, `tools/call` с проверкой allowlist', 'Harness, токен запуска', I9]
- ['`POST /v1/data/agent/g2` — G2 для `tools/call`', MCP-прокси перед вызовом сервера, I10]
- ['`POST /mcp` itsaplan-core с ключом агента из Secret', MCP-прокси, I24]
