title: MCP-прокси
tech: Go, официальный MCP Go SDK (D19)
kind: service
stories: [US-MCP-05, US-SBX-03]
params:
- {name: servers, value: itsaplan-core}
- {name: tools, value: 'минимальный (чтение задачи, комментарий)'}
- {name: auth.secret_ref, value: — (обязательный)}
does:
- Отдаёт агенту только разрешённые тулы
- 'Проверяет каждый вызов вне sandbox: allowlist манифеста и G2 в OPA'
- Подставляет учётные данные MCP-сервера из Secret по `auth.secret_ref`
io:
- {dir: ←, with: Harness, model: [McpToolCall], via: [I9]}
- {dir: →, with: Guardrails (OPA), model: [PolicyInput, PolicyDecision], what: '`PolicyInput` → `PolicyDecision`', via: [I10]}
- {dir: →, with: MCP itsaplan-core в api ICPlan, model: [McpToolCall], via: [I24]}
- {dir: →, with: Event relay, what: решение G2 с причиной}
data:
- {table: project_resource, access: read, via: [I4], why: 'MCP-серверы агента (`kind = mcp`, владелец Platform module)'}
- {table: run_event, access: write, via: [I2], why: решения G2 (владелец Observability)}
reqs: [R-MCP-02, R-MCP-03, R-RUN-13, R-GRD-03]
tasks: ['2.1']
failures:
- {when: Тул вне allowlist, then: 'вызов отклонён без обращения к серверу, решение G2 с причиной в событиях (R-RUN-13 «MCP-прокси запуска»)', reqs: [R-RUN-13]}
- {when: MCP-сервер недоступен, then: 'агент получает ошибку тула, цикл продолжается; чтение повторяется 2 раза, запись — нет (FMEA «MCP-сервер недоступен», I9)', via: [I9]}
- {when: OPA не ответила, then: решение по `on_engine_error` (deny)}
why: Проверка внутри sandbox обходится кодом агента; Runner уже знает манифест, токен и подтверждения.
rnd: mcp-vs-direct.md
ops:
- {op: '`tools/list` с фильтром по allowlist, `tools/call` с проверкой allowlist', endpoint: 'POST /runs/:runId/mcp/:server', who: 'Harness, токен запуска', via: [I9]}
- {op: G2 для `tools/call`, endpoint: POST /v1/data/agent/g2, who: MCP-прокси перед вызовом сервера, via: [I10]}
- {op: '`POST /mcp` itsaplan-core с ключом агента из Secret', endpoint: POST /mcp, who: MCP-прокси, via: [I24]}
