title: Admission
tech: 'Клиент OPA (G1, D6): `POST /v1/data/agent/g1`'
kind: service
stories: [US-GRD-03, US-RUN-01]
params:
- {name: guardrails.g1.enabled, value: 'true'}
- {name: on_engine_error, value: deny}
- {name: kill_switch, value: выкл}
- {name: budget.run / agent_day / project_month, value: 1 $ / 5 $ / задаётся}
does:
- Проверяет допуск агента к задаче, бюджет и kill switch до создания sandbox (R-GRD-02)
