- Недоступна OPA — решение по `on_engine_error` (по умолчанию deny)
io:
- {dir: ←, with: Scheduler, what: запуск со слотами}
- {dir: →, label: Guardrails (OPA), what: '`PolicyInput` → `PolicyDecision`', via: [I5]}
- {dir: →, with: Sandbox claim, what: допущенный запуск}
- {dir: →, with: Event relay, what: решение G1 с причиной — в события запуска}
data:
- {table: kill_switch, access: read, why: 'через данные OPA (владелец Platform module), напрямую не читает'}
- {table: agent_settings, access: read, why: 'через данные OPA: бюджеты и допуск (владелец Platform module)'}
reqs: [R-GRD-02, R-GRD-06, R-GRD-07, R-GRD-15]
tasks: ['4.3']
failures:
- {when: Бюджет исчерпан, then: 'запуск `limit_exceeded`, sandbox не создаётся', reqs: [R-GRD-02]}
- {when: Kill switch агента или платформы, then: запуск отклонён до создания sandbox, reqs: [R-GRD-02, R-GRD-15]}
- {when: OPA не ответила за 200 мс, then: 'решение по `on_engine_error`: deny — запуск не стартует', via: [I5], reqs: [R-GRD-07]}
why: Дешевле всего остановить трату до запуска.
rnd: guardrails-engine.md
ops:
- {op: 'допуск агента к задаче, бюджет, лимит параллельных запусков, kill switch', endpoint: POST /v1/data/agent/g1, label: 'Scheduler после занятия слотов, до создания sandbox', via: [I5]}
