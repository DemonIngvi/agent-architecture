title: Spend log
tech: LiteLLM spend logs (Postgres)
kind: store
stories: [US-LLM-03, US-LLM-05]
params: 'нет: параметров у журнала затрат в interfaces.md нет, политика хранения — по LiteLLM'
does:
- Записывает расход каждого вызова
- Учитывает токены и стоимость с привязкой к агенту и `run_id`
io:
- {dir: ←, with: Harness, what: вызовы модели с `metadata.run_id`, via: [I8]}
- {dir: →, label: PostgreSQL 17, what: запись строки затрат в БД `litellm`, via: [I14]}
data:
- {table: LiteLLM_SpendLogs, access: write, why: 'при каждом вызове, чтение для отчёта затрат (владелец — LiteLLM)'}
reqs: [R-LLM-02, R-LLM-03]
tasks: ['1.1', '4.5']
failures:
- {when: Провайдер вернул ошибку, then: 'неуспешный вызов учитывается отдельно, без стоимости ответа', reqs: [R-LLM-02]}
- {when: БД `litellm` недоступна, then: 'проверка бюджетов невозможна, вызовы отклоняются', fmea: llm-gateway}
why: Источник затрат по задаче и агенту.
rnd: observability.md
schema: 'Таблица `LiteLLM_SpendLogs`: ключ запроса, virtual key, модель, токены, стоимость, время и `metadata` (`run_id`, `issue_key`, агент). Стрим учитывается по завершении; неуспешный вызов — отдельно, без стоимости ответа.'
