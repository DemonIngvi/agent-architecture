title: Virtual keys
tech: LiteLLM virtual keys
kind: service
stories: [US-LLM-03]
params:
- {name: key.max_budget, value: бюджет ключа агента}
- {name: key.rpm / tpm, value: запросы и токены в минуту на ключ}
does:
- Отделяет агентов друг от друга по учёту и лимитам
- Ключ создаёт и обновляет Platform module через admin API (master key)
- 'Хук атрибуции: вызов без `run_id` отклоняется; ключ не агента запуска — затраты на агента ключа и событие в аудит (D26)'
io:
- {dir: ←, with: Platform module, what: 'создание и обновление ключа `/key/generate`, `/key/update`', via: [I15]}
- {dir: ←, with: Harness, what: вызов модели с Bearer virtual key и `metadata.run_id`, via: [I8]}
- {dir: →, with: PostgreSQL 17, what: ключи и бюджеты в БД `litellm`, via: [I14]}
data:
- {table: LiteLLM_VerificationToken, why: 'чтение и запись: ключ, бюджет, лимиты (владелец — LiteLLM)'}
reqs: [R-LLM-03, R-LLM-05]
tasks: ['4.5']
failures:
- {when: Вызов без `run_id`, then: отклонён (R-LLM-03 «Вызов без метаданных»), reqs: [R-LLM-03]}
- {when: Ключ не агента запуска, then: 'затраты на агента ключа, событие несоответствия в аудит (R-LLM-03 «Чужой ключ»)', reqs: [R-LLM-03]}
- {when: БД `litellm` недоступна, then: 'проверка бюджетов невозможна, вызовы отклоняются', fmea: llm-gateway}
why: Учёт и бюджет на агента без своего биллинга.
rnd: llm-gateway.md
ops:
- {op: 'создать или обновить ключ агента — `/key/generate`, `/key/update`', who: Platform module, via: [I15]}
- {op: 'проверка ключа, бюджета и атрибуции на каждом вызове', who: Harness, via: [I8]}
