title: Virtual keys
tech: LiteLLM virtual keys
kind: service
stories: [US-LLM-03]
params:
- [key.max_budget, 'бюджет ключа агента']
- [key.rpm / tpm, 'запросы и токены в минуту на ключ']
does:
- Отделяет агентов друг от друга по учёту и лимитам
- Ключ создаёт и обновляет Platform module через admin API (master key)
- 'Хук атрибуции: вызов без `run_id` отклоняется; ключ не агента запуска — затраты на агента ключа и событие в аудит (D26)'
io:
- [←, Platform module, 'создание и обновление ключа `/key/generate`, `/key/update` (I15)']
- [←, Harness, 'вызов модели с Bearer virtual key и `metadata.run_id` (I8)']
- [→, PostgreSQL 17, 'ключи и бюджеты в БД `litellm` (I14)']
data:
- [LiteLLM_VerificationToken, 'чтение и запись: ключ, бюджет, лимиты (владелец — LiteLLM)']
reqs: [R-LLM-03, R-LLM-05]
tasks: ['4.5']
failures:
- Вызов без `run_id` — отклонён (R-LLM-03 «Вызов без метаданных»)
- Ключ не агента запуска — затраты на агента ключа, событие несоответствия в аудит (R-LLM-03 «Чужой ключ»)
- БД `litellm` недоступна — проверка бюджетов невозможна, вызовы отклоняются (FMEA llm-gateway)
why: Учёт и бюджет на агента без своего биллинга.
rnd: llm-gateway.md
ops:
- ['создать или обновить ключ агента — `/key/generate`, `/key/update`', Platform module, I15]
- ['проверка ключа, бюджета и атрибуции на каждом вызове', Harness, I8]
