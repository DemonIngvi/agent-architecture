title: Fallback
tech: LiteLLM router fallbacks
kind: service
stories: [US-LLM-04]
params:
- {name: fallbacks, value: резервные модели; по умолчанию нет}
does:
- При сбое основной модели отвечает резервная
io:
- {dir: ←, with: Harness, what: вызов модели, via: [I8]}
- {dir: →, with: «провайдер / mock», what: 'основная, затем резервная модель', via: [I13]}
data:
- {table: LiteLLM_SpendLogs, access: write, why: факт использования резервной модели (владелец — LiteLLM)}
reqs: [R-LLM-06, R-LLM-11]
tasks: ['4.5']
failures:
- {when: Основная модель недоступна, then: 'запрос выполняет резервная, факт фиксируется в трейсе', reqs: [R-LLM-06]}
- {when: Резерв не задан, then: 'вызов завершается ошибкой, Harness применяет повтор', reqs: [R-LLM-06]}
- {when: Основная и резервная недоступны, then: ошибка `all_providers_failed`, reqs: [R-LLM-06]}
why: Агент работает при недоступности провайдера.
rnd: llm-gateway.md
ops:
- {op: повтор вызова резервной моделью при ошибке недоступности основной, who: LiteLLM, via: [I13]}
