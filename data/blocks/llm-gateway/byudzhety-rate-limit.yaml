title: Бюджеты, rate limit
tech: LiteLLM budgets, RPM / TPM
kind: service
stories: [US-LLM-03]
params:
- {name: key.max_budget, note: бюджет ключа из Platform module}
- {name: key.rpm / tpm, note: запросы и токены в минуту}
does:
- Отклоняет вызов до траты при превышении
- Ограничивает запросы и токены в минуту на модель и на агента (RPM / TPM)
io:
- {dir: ←, with: Harness, what: вызов модели с virtual key, via: [I8]}
- {dir: ←, with: Platform module, what: бюджет и лимиты ключа, via: [I15]}
- {dir: →, with: PostgreSQL 17, what: расход и бюджеты в БД `litellm`, via: [I14]}
data:
- {table: LiteLLM_VerificationToken, why: 'чтение и запись: расход, бюджет, лимиты ключа (владелец — LiteLLM)'}
- {table: LiteLLM_BudgetTable, access: read, why: бюджеты и лимиты (владелец — LiteLLM)}
reqs: [R-LLM-05, R-GRD-11, R-GRD-14]
tasks: ['4.5']
failures:
- {when: Бюджет virtual key исчерпан, then: отказ до обращения к провайдеру, reqs: [R-LLM-05]}
- {when: Превышен TPM модели, then: вызовы ждут или отклоняются с ошибкой лимита, reqs: [R-GRD-14]}
- {when: БД `litellm` недоступна, then: 'проверка бюджетов невозможна, вызовы отклоняются', fmea: llm-gateway}
why: Жёсткий стоп перерасхода на уровне шлюза (G4).
rnd: runaway-protection.md
ops:
- {op: отказ вызова при исчерпанном бюджете или лимите частоты, who: Harness, via: [I8]}
