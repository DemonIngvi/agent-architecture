title: Registry
tech: 'Таблицы ICPlan: агенты, тулы, навыки, ключи и учётные данные; MCP агента — ресурсы проекта Platform module (D23)'
kind: service
stories: [US-ICP-20, US-ICP-21, US-ICP-23, US-ICP-29]
params:
- {name: agent.version, value: последняя}
does:
- Хранит определения агентов и их ресурсы
- Отдаёт определение агента Runner и Harness
- 'Версии определения агента (доработка, R-REG-03): запуск закрепляет версию на старте — последнюю или указанную задачей (`settingsVersionId`); несуществующая версия — отказ (задача 2.3, MVP; решение владельца 2026-10-14)'
- Экспорт и импорт определения в YAML `agent/v1` (доработка, R-REG-04)
- Не даёт удалить ресурс, на который ссылаются (R-REG-05)
io:
- {dir: ←, with: Control Plane UI, what: 'определения агентов, тулы, навыки, MCP-серверы'}
- {dir: →, what: 'инструкция и навыки версии запуска, M5 (через Platform module — I4, D23; I7)', via: [I4, I7], decisions: [D23], with: Harness через Agent Runner}
data:
- {table: ai_agent, access: read-write, why: определение}
- {table: agent_tool, access: read-write, why: каталог тулов}
- {table: agent_skill, access: read-write, why: каталог навыков}
- {table: agent_tool_link, access: read-write}
- {table: agent_skill_link, access: read-write}
- {table: apikey, access: read-write, via: [I1, I3], why: 'ключ агента для I1–I3 и MCP (`reference_id` → `user.id`), показывается один раз'}
- {table: integration_credential, access: read-write, why: 'учётные данные тулов и ключи провайдеров внутренних агентов — шифротекст AES-256-GCM (`APP_ENCRYPTION_KEY`), клиенту не отдаётся'}
- {table: agent_settings_version, access: read, via: [I4], why: 'версии — снимок определения и наших настроек ведёт Platform module (D9); правка `PATCH /teams/:teamId/ai-agents/:agentId` форка версию сама не создаёт — Platform module при вызове I4 сравнивает хеш определения с последней версией и при отличии создаёт новую (D26)'}
- {table: agent_run, access: write, via: [I4], why: '`agent_version` запуска — Platform module закрепляет версию при первом вызове I4: указанную `Run.settingsVersionId` или последнюю; несуществующая — отказ (D23, R-REG-03, задача 2.3)'}
reqs: [R-REG-01, R-REG-02, R-REG-03, R-REG-04, R-REG-05, R-REG-06]
tasks: ['1.2', '2.3', '4.4']
failures:
- {when: БД ICPlan недоступна, then: 'определения не читаются, запуски не стартуют'}
- {when: 'Удаляется ресурс, на который ссылаются,', then: удаление отклоняется}
- {when: Импорт с неверной схемой, then: импорт отклоняется, fmea: agent-registry}
why: Источник правды — БД ICPlan; git только для ревью через экспорт.
rnd: config-storage.md
ops:
- {op: '`GET`, `POST /teams/:teamId/ai-agents`; `PATCH`, `DELETE /teams/:teamId/ai-agents/:agentId` — агенты', who: Control Plane UI, via: [I20]}
- {op: '`PUT /teams/:teamId/ai-agents/:agentId/projects`, `/skills`, `/tool-configs` — ресурсы агента', endpoint: 'PUT /teams/:teamId/ai-agents/:agentId/projects', who: Control Plane UI, via: [I20]}
- {op: новый ключ агента, endpoint: 'POST /teams/:teamId/ai-agents/:agentId/regenerate-key', who: Control Plane UI, via: [I20]}
- {op: 'версии и экспорт / импорт YAML — `GET /platform/agents/:agentId/export`, `POST /platform/agents/import` (Platform module)', who: Администратор, via: [I20]}
- {op: 'определение агента для запуска — `GET /platform/runs/:runId/agent`: Platform module читает таблицы Registry и отдаёт `{version, definition, settings}`; claim форка не меняется', endpoint: 'GET /platform/runs/:runId/agent', who: Agent Runner, via: [I4], decisions: [D23]}
