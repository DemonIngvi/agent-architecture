screens:
- {name: Агенты команды, where: Команда → Настройки → ИИ-агенты, what: 'список агентов, поиск, создание; у внешнего агента — в сети ли раннер', status: есть, code: 'apps/web/src/app/[teamRef]/settings/ai-agents/page.tsx', stories: [US-ICP-20, US-ICP-06]}
- {name: Карточка агента, where: ИИ-агенты → агент (боковая панель), what: 'модель и ключ провайдера (внутренний), инструкция, проекты, доступ (кто даёт работу), действия в проекте, триггеры (упоминание, делегат, поле), ключ API и раннер (внешний); у внешнего агента платформы — поля Registry: модель-алиас, навыки, тулы (MCP агента — ресурсы проекта, экран «Платформа: проект», D23) — `PATCH /teams/:teamId/ai-agents/:agentId`, `PUT /teams/:teamId/ai-agents/:agentId/skills`, `/tool-configs` (доработка, R-REG-02, D23, D24)', status: доработка, code: 'apps/web/src/features/teams/components/ai-agents/AgentSheetForm.tsx, TeamAiAgentFields.tsx', stories: [US-ICP-21]}
- {name: Выключение агента, where: карточка агента, what: 'выключить / включить; судьба активных запусков `onDisable`: finish / cancel', endpoints: ['PATCH /teams/:teamId/ai-agents/:agentId'], status: доработка, code: apps/web/src/features/teams/components/ai-agents/AgentSheetForm.tsx, stories: [US-ICP-22]}
- {name: История запусков агента, where: карточка агента → запуски, what: 'запуски по триггеру, новые сверху, по 25; у запуска — задача и итог', status: есть, code: apps/web/src/features/teams/components/ai-agents/TeamAiAgentRunsSheet.tsx, stories: [US-ICP-28]}
- {name: Тулы и навыки команды, where: Команда → Настройки → Инструменты / Навыки, what: 'каталог тулов с учётными данными, навыки с файлами', status: есть, code: 'apps/web/src/app/[teamRef]/settings/agent-tools, agent-skills', stories: [US-ICP-20]}
- {name: Доступ к MCP ICPlan, where: Команда → Настройки → MCP, what: 'переключатель: открыта ли команда MCP-клиентам (`team.mcp_enabled`) и какие проекты он охватывает (`project.mcp_enabled`); каталога MCP-серверов в форке нет — MCP агентов платформы задаются ресурсами проекта (D23)', status: есть, code: 'apps/web/src/app/[teamRef]/settings/mcp (TeamMcpSection)', stories: [US-ICP-20]}
- {name: Агенты проекта и расписания, where: Проект → Агенты, what: 'агенты, работающие в проекте; чат с агентом; регулярная работа по расписанию', status: есть, code: 'apps/web/src/app/[teamRef]/(shell)/[projectKey]/agents', stories: [US-ICP-24, US-ICP-19]}
- {name: Редактор процесса, where: Проект → Настройки → Типы задач → процесс, what: 'шаги: колонка, агент, переходы при успехе и ошибке, лимит, проверка — `GET /projects/:projectKey/processes`, `PUT /projects/:projectKey/processes/:issueTypeId`; Действие «делегировать агенту»', endpoints: ['POST /projects/:projectKey/actions'], status: новое, code: рядом с apps/web/src/features/settings/SettingsIssueTypesPage.tsx, stories: [US-ICP-05, US-ICP-25, US-ICP-26, US-ICP-27]}
- {name: 'Платформа: агент', where: карточка агента → «Платформа», what: 'автономия, бюджеты, профили, тулы с подтверждением, kill switch агента, история и откат настроек — `GET`, `PATCH /platform/agents/:agentId/settings`, `…/settings/versions`, `…/settings/rollback`, экспорт и импорт, `PUT /platform/kill-switch/:scope` (`agent:<id>`); право `ai_agents` (D24)', status: новое, code: раздел в стеке apps/web/src/features/teams/components/ai-agents/TeamAiAgentFields.tsx; после PR в upstream — точка расширения `@/cloud`, stories: [US-ICP-21]}
- {name: 'Платформа: проект', where: Проект → ИИ-команда → «Платформа», what: 'руководство, месячный бюджет, ресурсы и доступы агентов, шаг подготовки — чтение `GET /platform/projects/:projectKey`; запись `/platform/projects/:projectKey/guidance`, `/budget`, `/access`, `/resources`, `/setup`; право `ai_agents` (D24)', status: новое, code: 'раздел в apps/web/src/utils/settingsSections.ts (`SETTINGS_SECTIONS`), сообщения messages/*/sections.json', stories: [US-ICP-21]}
- {name: 'Платформа: экземпляр', where: God mode → «Платформа», what: 'профили среды и памяти (удаление запрещено, пока профиль используется — 409), глобальный kill switch, журнал изменений — `/platform/sandbox-profiles`, `/platform/memory-profiles` (`GET`, `PUT`, `DELETE`), `PUT /platform/kill-switch/:scope` (`platform`), `GET /platform/audit`; владелец экземпляра (D24)', status: новое, code: 'точка расширения `@/cloud` (как godSections.ts), новая страница маршрута', stories: [US-ICP-21]}
