does:
- Создание и настройка агентов
- Подключение тулов и навыков; доступ команды к MCP ICPlan
- Проверка агента в чате, выключение агента (3.8)
- Ключи провайдеров команды — только для внутренних агентов ICPlan; агенты платформы ходят к моделям через virtual key LiteLLM (D5)
