title: Run Queue + runner API
tech: Очередь `agent_run` + протокол `@itsaplan/runner` (опрос, стрим)
kind: service
stories: [US-ICP-07, US-ICP-29, US-ICP-04, US-ICP-06, US-ICP-10]
params:
- [AGENT_RUN_LEASE_SECONDS, '300']
- [AGENT_RUN_MAX_ATTEMPTS, '3']
- [runner.offline_after_s, '60']
- [protocol.version, '0.5']
- [agent.runner_scope, team]
- [agent.delegation_delay_sec, '120']
does:
- Хранит запуски в статусе pending
- Отдаёт запуск внешнему раннеру (наш Agent Runner) с арендой; Runner опрашивает очередь со своим интервалом
- Принимает стрим шагов и итог; повторный итог уже завершённого запуска — 404 (`finishRun` форка обновляет только `pending`)
- Отдаёт решения и указания пользователя в ответе heartbeat (доработка, R-ICP-16); отмену — ответом 404 на heartbeat, как в форке
- Запуск, выданный `AGENT_RUN_MAX_ATTEMPTS` = 3 раза без итога, при следующем claim завершается `failed` с `last_error` «Runner did not report a result» и записью в истории задачи (`expireExhaustedRuns` форка)
io:
- [←, Автоподхват, '`Run` (pending)']
- [→, Agent Runner, '`Run` — выдача с арендой (I1)']
- [←, Agent Runner, '`RunEvent`, `RunResult` (I2)']
- [↔, Agent Runner, 'heartbeat: продление аренды, решения, указания; отмена — 404 (I3)']
data:
- [agent_run, 'запись, чтение: очередь и итог, доработанные поля RunResult']
- [run_event, 'запись: шаги запуска — таблица Observability (схема `platform`)']
- [agent_run_delivery, 'чтение, запись: решения и указания до подтверждения Runner (R-ICP-16)']
- [apikey, 'чтение: ключ агента']
reqs: [R-ICP-02, R-ICP-03, R-ICP-04, R-ICP-07, R-ICP-09, R-ICP-16, R-AP-12, R-AP-17]
tasks: ['2.1', '3.3', '3.6']
failures:
- Runner не в сети дольше `runner.offline_after_s` — агенты «не в сети», запуски ждут
- Runner упал трижды на одном запуске (аренда истекла `AGENT_RUN_MAX_ATTEMPTS` раз) — запуск `failed`, процесс идёт по ошибке шага (R-AP-12)
- Несовместимая версия протокола — Runner не берёт запуски
- БД ICPlan недоступна — выдача и приём итогов останавливаются, Runner повторяет с backoff (FMEA icplan-integration)
why: Протокол уже есть — Agent Runner подключается к нему, ICPlan почти не меняем.
rnd: runner-and-scheduling.md
ops:
- ['`POST /agent-runs/claim` — выдать запуск с арендой', Agent Runner, I1]
- ['`POST /agent-runs/:runId/events` — шаги запуска', Agent Runner, I2]
- ['`POST /agent-runs/:runId/result` — итог', Agent Runner, I2]
- ['`POST /agent-runs/:runId/heartbeat` — аренда, решения; отмена — ответ 404', Agent Runner, I3]
- ['`GET /agent-runs/:runId/stream` — живой поток для чата запуска', Task UI, I20]
