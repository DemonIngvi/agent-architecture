title: Run Queue + runner API
tech: Очередь `agent_run` + протокол `@itsaplan/runner` (опрос, стрим)
kind: service
stories: [US-ICP-07, US-ICP-29, US-ICP-04, US-ICP-06, US-ICP-10]
params:
- {name: AGENT_RUN_LEASE_SECONDS, value: '300'}
- {name: AGENT_RUN_MAX_ATTEMPTS, value: '3'}
- {name: runner.offline_after_s, value: '60'}
- {name: protocol.version, value: '0.5'}
- {name: agent.runner_scope, value: team}
- {name: agent.delegation_delay_sec, value: '120'}
does:
- Хранит запуски в статусе pending
- Отдаёт запуск внешнему раннеру (наш Agent Runner) с арендой; Runner опрашивает очередь со своим интервалом
- Принимает стрим шагов и итог; повторный итог уже завершённого запуска — 404 (`finishRun` форка обновляет только `pending`)
- Отдаёт решения и указания пользователя в ответе heartbeat (доработка, R-ICP-16); отмену — ответом 404 на heartbeat, как в форке
- Запуск, выданный `AGENT_RUN_MAX_ATTEMPTS` = 3 раза без итога, при следующем claim завершается `failed` с `last_error` «Runner did not report a result» и записью в истории задачи (`expireExhaustedRuns` форка)
io:
- {dir: ←, with: Автоподхват, model: [Run], what: '`Run` (pending)'}
- {dir: →, with: Agent Runner, model: [Run], what: выдача с арендой, via: [I1]}
- {dir: ←, with: Agent Runner, model: [RunEvent, RunResult], via: [I2]}
- {dir: ↔, with: Agent Runner, what: 'heartbeat: продление аренды, решения, указания; отмена — 404', via: [I3]}
data:
- {table: agent_run, access: read-write, why: 'очередь и итог, доработанные поля RunResult'}
- {table: run_event, access: write, why: шаги запуска — таблица Observability (схема `platform`)}
- {table: agent_run_delivery, why: 'чтение, запись: решения и указания до подтверждения Runner (R-ICP-16)'}
- {table: apikey, access: read, why: ключ агента}
reqs: [R-ICP-02, R-ICP-03, R-ICP-04, R-ICP-07, R-ICP-09, R-ICP-16, R-AP-12, R-AP-17]
tasks: ['2.1', '3.3', '3.6']
failures:
- {when: Runner не в сети дольше `runner.offline_after_s`, then: 'агенты «не в сети», запуски ждут'}
- {when: Runner упал трижды на одном запуске (аренда истекла `AGENT_RUN_MAX_ATTEMPTS` раз), then: 'запуск `failed`, процесс идёт по ошибке шага', reqs: [R-AP-12]}
- {when: Несовместимая версия протокола, then: Runner не берёт запуски}
- {when: БД ICPlan недоступна, then: 'выдача и приём итогов останавливаются, Runner повторяет с backoff', fmea: icplan-integration}
why: Протокол уже есть — Agent Runner подключается к нему, ICPlan почти не меняем.
rnd: runner-and-scheduling.md
ops:
- {op: выдать запуск с арендой, endpoint: POST /agent-runs/claim, who: Agent Runner, via: [I1]}
- {op: шаги запуска, endpoint: 'POST /agent-runs/:runId/events', who: Agent Runner, via: [I2]}
- {op: итог, endpoint: 'POST /agent-runs/:runId/result', who: Agent Runner, via: [I2]}
- {op: 'аренда, решения; отмена — ответ 404', endpoint: 'POST /agent-runs/:runId/heartbeat', who: Agent Runner, via: [I3]}
- {op: живой поток для чата запуска, endpoint: 'GET /agent-runs/:runId/stream', who: Task UI, via: [I20]}
