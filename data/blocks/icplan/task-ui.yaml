params:
- [issue.review_with_me, выкл]
does:
- Доска, статусы, карточка задачи, комментарии, чат агента
- Показывает ход работы агента (чат запуска, задача 3.3) и итог
- Даёт человеку подтвердить опасное действие (3.4)
- Показывает затраты задачи из LiteLLM (3.5)
io:
- [←, api ICPlan (SSE), '`RunEvent` — шаги в чате запуска (I20)']
- [←, api ICPlan, '`CostAggregate` — затраты задачи (I20)']
- [→, api ICPlan, 'смена колонки, approve, указания пользователя, вердикт (I20)']
data:
- [issue, 'чтение, запись: колонка, делегат, исполнитель, `review_with_me`']
- [run_event, 'чтение: чат запуска (таблица Observability)']
- [agent_run, 'чтение: итог запуска']
- [issue_process_state, 'чтение, запись: шаг, вердикт `last_verdict`']
- [agent_run_delivery, 'запись: решения и указания до доставки Runner']
- [LiteLLM_SpendLogs, 'чтение: затраты задачи (роль `litellm_read`)']
reqs: [R-ICP-04, R-ICP-05, R-ICP-06, R-ICP-07, R-ICP-16, R-AP-04, R-AP-07, R-AP-18, R-AP-19, R-AP-20, R-AP-21, R-OBS-05]
tasks: ['3.3', '3.4', '3.5', '3.7']
failures:
- БД ICPlan недоступна — задача и чат не загружаются, действия пользователя не сохраняются (FMEA icplan-integration)
- Runner не в сети — агенты помечены «не в сети», запуски ждут в очереди
- Поток SSE оборвался — Task UI переподключается, пропущенные шаги берёт из `GET /issues/:issueId/agent-feed` (R-ICP-04)
- Журнал затрат LiteLLM недоступен или цена не задана — затраты показываются как «неизвестно», задача работает (R-OBS-05)
why: Пользователи остаются в привычном трекере; всё про агента видно в задаче.
rnd: tracker-choice.md
