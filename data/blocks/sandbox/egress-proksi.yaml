title: Egress-прокси
tech: 'Squid (D18): allowlist доменов по CONNECT, без расшифровки TLS; две подсети — среда агента и шаг подготовки (D19)'
kind: service
stories: [US-SBX-03]
params:
- {name: network.egress_allow, value: только платформа}
- {name: setup.registries, value: 'pypi.org, files.pythonhosted.org, registry.npmjs.org'}
does:
- Весь исходящий трафик только через прокси
- Блокирует запрещённые хосты, пишет событие
- Реестры пакетов — только подсети шага подготовки
- 'Секреты: внешние хосты — прокси; MCP — MCP-прокси Runner'
io:
- {dir: ←, label: Sandbox (среда агента), what: исходящие соединения, via: [I17]}
- {dir: →, label: «внешние хосты», what: разрешённые запросы с подставленным секретом, via: [I17]}
data:
- {table: sandbox_profile, access: read, why: '`egress_allow` профиля (владелец — Platform module)'}
- {table: access_policy, access: read, why: конфиг allowlist генерируется из политики доступа (владелец — Platform module)}
reqs: [R-SBX-06, R-SBX-07, R-SBX-13]
tasks: ['4.2']
failures:
- {when: Прокси упал, then: 'исходящий трафик запрещён (fail-closed), перезапуск прокси', fmea: agent-sandbox}
- {when: Домен вне allowlist, then: 'соединение блокируется, событие фиксируется'}
- {when: Реестр пакетов недоступен на шаге подготовки, then: 'шаг завершается ошибкой, запуск `failed`; есть кэш — используется кэш'}
why: Закрывает утечки и доступ к внутренним сервисам (G3).
rnd: sandbox-isolation.md
ops:
- {op: CONNECT / HTTP к внешнему хосту — пропуск по allowlist подсети источника, label: 'среда агента (`sbx-agent`), контейнер подготовки (`sbx-setup`)', via: [I17]}
- {op: подстановка учётных данных внешнего хоста; подставленный секрет агенту не возвращается, label: внутри, via: [I17]}
