title: SandboxProvider
tech: Интерфейс create / claim / exec / destroy; Docker сейчас, K8s позже
kind: service
stories: [US-SBX-01, US-SBX-04]
params:
- [provider, docker]
- [runtime, runc]
does:
- 'Скрывает, где исполняется контейнер: Docker сейчас, K8s позже'
- 'Создаёт среду по профилю: образ, runtime, ресурсы, свой `/workspace`'
- Уничтожает среду вместе с `/workspace`; общих томов между запусками нет
io:
- [←, Agent Runner, '`SandboxClaim`, `RepoGrant` (I6; этап 4 — I23)']
- [→, Harness, контейнер со средой запуска (I7 идёт внутри него)]
data:
- [sandbox_profile, 'чтение через Runner: `image`, `runtime`, `cpu`, `memory_mb`, `disk_gb` (владелец — Platform module)']
reqs: [R-SBX-01, R-SBX-09, R-SBX-10, R-SBX-13]
tasks: ['2.2', '4.6']
failures:
- Docker / K8s API не ответил за 30 с — вызов прерывается, повтор 1 раз; create не повторяется автоматически (R-SBX-10)
- Образ не скачивается — запуск не стартует, профиль помечен недоступным (FMEA agent-sandbox)
- Нет ресурсов хоста — запуск ждёт в `queued`
why: Смена Docker → K8s → microVM без изменения Runner.
rnd: sandbox-isolation.md
ops:
- [create / exec / destroy контейнера — Docker Engine API (этапы 1–3), Agent Runner, I6]
- [create / destroy Pod в namespace `itsaplan-agents` — Kubernetes API (этап 4), Agent Runner, I23]
