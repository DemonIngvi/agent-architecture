title: SandboxProvider
tech: Интерфейс create / claim / exec / destroy; Docker сейчас, K8s позже
kind: service
stories: [US-SBX-01, US-SBX-04]
params:
- {name: provider, value: docker}
- {name: runtime, value: runc}
does:
- 'Скрывает, где исполняется контейнер: Docker сейчас, K8s позже'
- 'Создаёт среду по профилю: образ, runtime, ресурсы, свой `/workspace`'
- Уничтожает среду вместе с `/workspace`; общих томов между запусками нет
io:
- {dir: ←, with: Agent Runner, what: '`SandboxClaim`, `RepoGrant` (I6; этап 4 — I23)'}
- {dir: →, with: Harness, what: контейнер со средой запуска (I7 идёт внутри него)}
data:
- {table: sandbox_profile, access: read, why: 'через Runner: `image`, `runtime`, `cpu`, `memory_mb`, `disk_gb` (владелец — Platform module)'}
reqs: [R-SBX-01, R-SBX-09, R-SBX-10, R-SBX-13]
tasks: ['2.2', '4.6']
failures:
- {when: Docker / K8s API не ответил за 30 с, then: 'вызов прерывается, повтор 1 раз; create не повторяется автоматически', reqs: [R-SBX-10]}
- {when: Образ не скачивается, then: 'запуск не стартует, профиль помечен недоступным', fmea: agent-sandbox}
- {when: Нет ресурсов хоста, then: запуск ждёт в `queued`}
why: Смена Docker → K8s → microVM без изменения Runner.
rnd: sandbox-isolation.md
