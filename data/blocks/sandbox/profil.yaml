title: Профиль
tech: Ограничения контейнера
kind: store
stories: [US-SBX-01, US-SBX-03]
params:
- [resources, '1 CPU, 1 ГБ, 2 ГБ']
- [image, 'agent-harness:<версия>']
- [runtime, runc]
does:
- Ограничивает ресурсы и права (G3)
- Задаёт образ и runtime среды (runc; runsc — после проверки 2.2.8)
- Отклоняет значения вне границ `resources` с именем параметра
io:
- [←, Platform module, 'профиль агента через Runner (I4, `sandbox_profile`)']
- [→, SandboxProvider, параметры создания среды]
data:
- [sandbox_profile, 'чтение: профиль среды агента (владелец — Platform module)']
- [agent_settings, 'чтение: `sandbox_profile_id` агента (владелец — Platform module)']
reqs: [R-SBX-05, R-SBX-08, R-SBX-09]
tasks: ['2.2']
failures:
- Профиль не найден — запуск отклоняется до создания контейнера (R-SBX-05)
- '`runtime: runsc`, а на узле нет runsc — запуск отклоняется с причиной «runtime недоступен»'
- Процесс превысил лимит RAM — контейнер останавливается, запуск `failed` с причиной
- Переполнен диск `/workspace` — запись отклоняется, агент получает ошибку (FMEA agent-sandbox)
why: Агент не съест хост и не выйдет за границы.
rnd: sandbox-isolation.md
schema: 'Таблица `sandbox_profile` (схема `platform`, владелец — Platform module): `image`, `runtime`, `cpu`, `memory_mb`, `disk_gb`, `egress_allow`, `pool_size`. Изоляция контейнера — Deploy Sandbox: read-only rootfs, `no-new-privileges`, drop ALL capabilities, seccomp RuntimeDefault.'
