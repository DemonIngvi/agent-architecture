title: Тёплый пул
tech: Docker-контейнеры, заранее запущенные
kind: service
stories: [US-SBX-01]
params:
- [pool.size, 2 на профиль]
- [image, 'agent-harness:<версия>']
does:
- Держит `pool.size` готовых контейнеров на профиль
- Отдаёт контейнер запуску без создания (старт < 1 с)
- Пуст — контейнер создаётся на лету, запуск ждёт его старта
- Уничтожает контейнер после запуска и доливает пул; повторно контейнер не выдаёт
io:
- [←, Agent Runner, '`SandboxClaim` — запрос среды по профилю (I6)']
- [→, Agent Runner, '`sandboxId` готового контейнера (I6)']
- [←, Agent Runner, уничтожить контейнер по `sandboxId` (I6)]
data:
- [sandbox_profile, 'чтение через Runner: `pool_size`, `image` профиля (владелец — Platform module)']
reqs: [R-SBX-01, R-SBX-02, R-SBX-11, R-SBX-13]
tasks: ['4.1']
failures:
- Нет ресурсов хоста — пул не доливается, запуск ждёт в `queued` (FMEA agent-sandbox)
- Образ недоступен — профиль помечен недоступным, запуски отклоняются
- Пул пуст — контейнер создаётся на лету, старт дольше
why: 'Подход E2B, Copilot agent: скорость без потери изоляции.'
rnd: sandbox-isolation.md
ops:
- [claim — выдать готовый контейнер профиля (`SandboxClaim` → `sandboxId`), Agent Runner (Sandbox claim), I6]
- [destroy + долив — уничтожить контейнер после запуска и поднять новый до `pool.size`, Agent Runner (Finalizer), I6]
- [пересоздание пула при смене образа профиля или нового `HARNESS_IMAGE`, внутри, внутри]
