title: Тёплый пул
tech: Docker-контейнеры, заранее запущенные
kind: service
stories: [US-SBX-01]
params:
- {name: pool.size, note: 2 на профиль}
- {name: image, value: 'agent-harness:<версия>'}
does:
- Держит `pool.size` готовых контейнеров на профиль
- Отдаёт контейнер запуску без создания (старт < 1 с)
- Пуст — контейнер создаётся на лету, запуск ждёт его старта
- Уничтожает контейнер после запуска и доливает пул; повторно контейнер не выдаёт
io:
- {dir: ←, with: Agent Runner, model: [SandboxClaim], what: запрос среды по профилю, via: [I6]}
- {dir: →, with: Agent Runner, what: '`sandboxId` готового контейнера', via: [I6]}
- {dir: ←, with: Agent Runner, what: уничтожить контейнер по `sandboxId`, via: [I6]}
data:
- {table: sandbox_profile, access: read, why: 'через Runner: `pool_size`, `image` профиля (владелец — Platform module)'}
reqs: [R-SBX-01, R-SBX-02, R-SBX-11, R-SBX-13]
tasks: ['4.1']
failures:
- {when: Нет ресурсов хоста, then: 'пул не доливается, запуск ждёт в `queued`', fmea: agent-sandbox}
- {when: Образ недоступен, then: 'профиль помечен недоступным, запуски отклоняются'}
- {when: Пул пуст, then: 'контейнер создаётся на лету, старт дольше'}
why: 'Подход E2B, Copilot agent: скорость без потери изоляции.'
rnd: sandbox-isolation.md
ops:
- {op: claim — выдать готовый контейнер профиля (`SandboxClaim` → `sandboxId`), label: Agent Runner (Sandbox claim), via: [I6]}
- {op: destroy + долив — уничтожить контейнер после запуска и поднять новый до `pool.size`, label: Agent Runner (Finalizer), via: [I6]}
- {op: пересоздание пула при смене образа профиля или нового `HARNESS_IMAGE`, label: внутри, internal: true}
