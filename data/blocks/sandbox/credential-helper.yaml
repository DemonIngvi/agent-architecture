title: Credential helper
tech: git credential helper / подстановка прокси
kind: service
stories: [US-SBX-02, US-SBX-05, US-SBX-07]
params:
- [workspace.sources, нет]
- [repos.clone_depth, '1']
does:
- Даёт git доступ к репозиторию без секрета в окружении
- Клонирует только репозитории из манифеста с правом read или write
- Запрещает push в защищённые ветки — только ветка агента
- Право read запрещает запись и выгрузку папки
io:
- [←, Agent Runner, '`RepoGrant`: какие репозитории и ветки, без токена (I6)']
- [→, «git-провайдер», 'клон, ветка `agent/<KEY>`, PR через прокси']
- [↔, infrastructure, 'папка задачи из RustFS и выгрузка подпапки шага (I19, через Runner)']
data:
- [access_policy, 'чтение через Runner: права read / write агента на ресурс (владелец — Platform module, D18)']
- [project_resource, 'чтение через Runner: git и папки проекта (владелец — Platform module)']
reqs: [R-SBX-03, R-SBX-04, R-SBX-07, R-SBX-14]
tasks: ['2.2', '4.2']
failures:
- Репозиторий вне allowlist — доступ отклонён (R-SBX-04)
- Push в защищённую ветку — отклонён
- 'RustFS недоступен — старт без папки: запуск с ошибкой «нет рабочего пространства»; выгрузка — повтор 3 раза, затем итог с пометкой «артефакты не сохранены» (FMEA agent-sandbox)'
why: Агент не видит токен — не может его утечь.
rnd: sandbox-isolation.md
ops:
- ['клон источников манифеста в `/workspace/<имя>`: git — ветка `agent/<KEY>`, папка — копия из объектного хранилища', Agent Runner при старте среды, I6]
- [выдача учётных данных git по `RepoGrant` (токен в env не попадает), git в среде агента, внутри]
- [выгрузка своей подпапки шага (право write) в объектное хранилище, Agent Runner в конце запуска, I19]
