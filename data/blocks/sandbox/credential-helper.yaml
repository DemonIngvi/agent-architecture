title: Credential helper
tech: git credential helper / подстановка прокси
kind: service
stories: [US-SBX-02, US-SBX-05, US-SBX-07]
params:
- {name: workspace.sources, value: нет}
- {name: repos.clone_depth, value: '1'}
does:
- Даёт git доступ к репозиторию без секрета в окружении
- Клонирует только репозитории из манифеста с правом read или write
- Запрещает push в защищённые ветки — только ветка агента
- Право read запрещает запись и выгрузку папки
io:
- {dir: ←, with: Agent Runner, model: [RepoGrant], what: '`RepoGrant`: какие репозитории и ветки, без токена', via: [I6]}
- {dir: →, with: «git-провайдер», what: 'клон, ветка `agent/<KEY>`, PR через прокси'}
- {dir: ↔, with: infrastructure, what: 'папка задачи из RustFS и выгрузка подпапки шага (I19, через Runner)', via: [I19]}
data:
- {table: access_policy, access: read, why: 'через Runner: права read / write агента на ресурс (владелец — Platform module, D18)'}
- {table: project_resource, access: read, why: 'через Runner: git и папки проекта (владелец — Platform module)'}
reqs: [R-SBX-03, R-SBX-04, R-SBX-07, R-SBX-14]
tasks: ['2.2', '4.2']
failures:
- {when: Репозиторий вне allowlist, then: доступ отклонён, reqs: [R-SBX-04]}
- {when: Push в защищённую ветку, then: отклонён}
- {when: RustFS недоступен, then: 'старт без папки: запуск с ошибкой «нет рабочего пространства»; выгрузка — повтор 3 раза, затем итог с пометкой «артефакты не сохранены»', fmea: agent-sandbox}
why: Агент не видит токен — не может его утечь.
rnd: sandbox-isolation.md
ops:
- {op: 'клон источников манифеста в `/workspace/<имя>`: git — ветка `agent/<KEY>`, папка — копия из объектного хранилища', who: Agent Runner при старте среды, via: [I6]}
- {op: выдача учётных данных git по `RepoGrant` (токен в env не попадает), who: git в среде агента, internal: true}
- {op: выгрузка своей подпапки шага (право write) в объектное хранилище, who: Agent Runner в конце запуска, via: [I19]}
