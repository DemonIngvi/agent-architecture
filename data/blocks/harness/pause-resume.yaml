title: Pause / resume
tech: LangGraph `interrupt` + свой checkpointer через API Runner (I12, D18)
kind: service
stories: [US-HAR-02, US-HAR-05, US-HAR-07, US-ICP-11]
params:
- {name: approval.tools, value: из guardrails}
- {name: checkpoint.ttl, value: 7 дней}
does:
- Останавливается на approve или вопросе
- Продолжает с того же шага без повтора предыдущих
- Восстанавливается после падения процесса из checkpoint Runner
io:
- {dir: ←, with: Agent Runner, model: [ApprovalDecision], via: [I7]}
- {dir: ↔, with: Agent Runner, model: [Checkpoint], via: [I12]}
- {dir: →, with: Event stream, what: '`CUSTOM` `approval_request`, `question`'}
data:
- {table: run_checkpoint, access: read-write, via: [I12], why: 'через Runner (I12, владелец — Agent Runner; учётных данных БД в sandbox нет)'}
- {table: agent_run_delivery, access: indirect, why: решения и ответы доставляет Runner из ICPlan (владелец — ICPlan)}
reqs: [R-HRN-05, R-HRN-11]
tasks: ['1.5']
failures:
- {when: Checkpointer недоступен, then: 'пауза невозможна, опасные действия отклоняются', fmea: agent-harness}
- {when: Подтверждение не пришло за `approval_timeout`, then: 'действие отклонено, запуск продолжается без него или завершается по политике'}
- {when: Процесс упал, then: новый процесс продолжает с последнего сохранённого шага}
why: Ключевое преимущество LangGraph перед своим циклом.
rnd: harness-framework.md
ops:
- {op: '`interrupt` перед тулом из `approval.tools` или на вопрос пользователю', who: 'Hooks, агент', internal: true}
- {op: решение пользователя или ответ на вопрос, endpoint: POST /run/approval, who: Agent Runner, via: [I7]}
- {op: 'состояние после шага; `GET /runs/:runId/checkpoint` — восстановление', endpoint: 'PUT /runs/:runId/checkpoint', who: Pause / resume → Agent Runner, via: [I12]}
