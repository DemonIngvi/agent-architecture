title: Bootstrap
tech: Python, загрузка `AgentDefinition`
kind: service
stories: [US-HAR-01, US-MEM-07]
params:
- {name: prompt.platform_version, value: версия образа Harness}
does:
- 'Собирает агента: промпт, навыки, тулы, лимиты'
- Даёт агенту только тулы и навыки из определения
- Проверяет параметры по границам «Мин»–«Макс» с именем параметра в ошибке (R-HRN-10)
io:
- {dir: ←, with: Agent Runner, model: [RunBundle], what: '`RunBundle`: определение версии запуска, задание, память на старте, манифест, MCP', via: [I7]}
- {dir: →, with: Context Manager, what: 'собранный агент: инструкция, навыки, тулы, лимиты'}
data:
- {table: ai_agent, access: read, via: [I4], why: 'через Runner: определение агента в `RunBundle` (владелец — ICPlan; источник — Platform module, I4)'}
- {table: agent_settings_version, access: read, why: 'через Runner: версия определения запуска (владелец — Platform module, D23)'}
reqs: [R-HRN-01, R-HRN-10]
tasks: ['1.3']
failures:
- {when: Определение не проходит схему, then: 'цикл не стартует, запуск завершается `invalid_definition`', fmea: agent-harness}
- {when: Навык из определения не найден, then: запуск завершается ошибкой с именем навыка}
- {when: Параметр вне границ, then: 'значение отклонено, ошибка называет параметр и границы'}
why: Агент полностью задаётся конфигом.
rnd: harness-framework.md
ops:
- {op: 'принять `RunBundle`, проверить определение по схеме `agent/v1`, собрать агента и начать цикл', endpoint: POST /run, label: Agent Runner (Run supervisor), via: [I7]}
- {op: готовность процесса и версия до `POST /run`, endpoint: GET /ready, who: Agent Runner, via: [I7]}
