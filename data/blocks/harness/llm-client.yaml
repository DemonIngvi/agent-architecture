title: LLM client
tech: OpenAI-совместимый клиент → LiteLLM
kind: service
stories: [US-HAR-01]
params:
- {name: model.temperature, value: '0.2'}
- {name: model.top_p, value: '1.0'}
- {name: model.max_output_tokens, value: '8192'}
- {name: model.reasoning_effort, value: medium}
- {name: model.reasoning_budget_tokens, value: '8000'}
- {name: model.tool_choice, value: auto}
- {name: model.response_format, value: text}
- {name: request.timeout_s, value: '120'}
does:
- Вызывает модель только через LiteLLM
- Передаёт метаданные для учёта
- Повторяет вызов с backoff (2 раза); токены повтора учитываются в бюджете
io:
- {dir: ←, with: Context Manager, what: запрос по слоям}
- {dir: →, with: llm-gateway, model: [ChatCompletionRequest], via: [I8]}
- {dir: →, with: Tool Executor, what: запросы вызова тулов из ответа модели}
data:
- {table: LiteLLM_SpendLogs, access: indirect, why: LiteLLM пишет расход вызова с `metadata.run_id` (владелец — LLM Gateway)}
- {table: LiteLLM_VerificationToken, access: indirect, why: virtual key агента проверяет LiteLLM; ключ подставляет egress-прокси (владелец — LLM Gateway)}
reqs: [R-HRN-03, R-HRN-12, R-HRN-13, R-HRN-18]
tasks: ['1.3']
failures:
- {when: LiteLLM недоступен, then: повтор с backoff; после `circuit.max_errors` — `failed`, fmea: agent-harness}
- {when: Учётные данные отклонены по I8, then: 'без повтора, событие с причиной', reqs: [R-HRN-12]}
- {when: Параметр не поддерживается моделью, then: 'LiteLLM отбрасывает его (`drop_params`), событие с именем параметра'}
why: Одна точка выхода к моделям и учёт затрат по задаче.
rnd: llm-gateway.md
ops:
- {op: 'узел `llm`: OpenAI Chat Completions к LiteLLM по алиасу модели агента, SSE-стрим, `metadata.run_id`', label: граф LangGraph, via: [I8]}
