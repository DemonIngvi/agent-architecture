title: Hooks
tech: Узлы графа before/after llm и tool, on_stop
kind: service
stories: [US-HAR-02, US-HAR-04]
params:
- {name: hooks, value: G2}
does:
- Проверяет каждое действие (G2)
- Ловит зацикливание и серию ошибок (R-GRD-09, R-GRD-13)
- Может изменить аргументы или отклонить вызов; изменение видно в событии
io:
- {dir: ←, with: LLM client, what: действие перед вызовом тула}
- {dir: ↔, with: guardrails, model: [PolicyInput, PolicyDecision], what: '`PolicyInput` / `PolicyDecision`', via: [I10]}
- {dir: →, with: Pause / resume, what: решение «нужно подтверждение»}
- {dir: →, with: Event stream, what: решение G2 событием}
data:
- {table: run_event, access: indirect, why: 'решение G2 — событие `CUSTOM` `guardrail_decision`, пишет Runner (владелец — Observability)'}
reqs: [R-HRN-04, R-GRD-09, R-GRD-13]
tasks: ['1.5', '1.6']
failures:
- {when: Hook упал с исключением, then: 'действие отклоняется (fail-closed), событие об ошибке hook', reqs: [R-HRN-04]}
- {when: OPA не ответил за 200 мс, then: 'без повтора, по `on_engine_error`', via: [I10]}
why: Правила применяются на каждом шаге детерминированно.
rnd: runaway-protection.md
ops:
- {op: '`before_tool` / `after_tool`, `before_llm` / `after_llm`, `on_stop` — узлы графа', who: граф LangGraph, internal: true}
- {op: проверка действия G2 — `POST /v1/data/agent/g2`, endpoint: POST /v1/data/agent/g2, who: hook `before_tool`, via: [I10]}
