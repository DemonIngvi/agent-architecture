title: Memory API
tech: Сервис над БД ICPlan
kind: service
stories: [US-MEM-01, US-MEM-02, US-MEM-03, US-MEM-10]
params:
- {name: read, value: какие уровни памяти отдавать в контекст}
- {name: write, value: какие уровни агент может писать}
- {name: m2_last_runs, note: сколько итогов прошлых запусков добавлять в контекст}
- {name: retention, value: срок хранения; для M1 и M2 — срок чтения}
- {name: scope, value: 'область записи: задача, агент, проект, команда'}
- {name: m3_max_kb, note: предельный размер записи M3}
does:
- Проверяет права и области
- Отдаёт память в контекст запуска
- M1 и M2 старше `retention` профиля не отдаёт; строки форка не удаляет — их удаляет ICPlan, `POST /retention/run` чистит только M3 (D25)
- Проверяет запись M3 до сохранения (профиль, область, схема и размер, секреты)
- Позволяет администратору удалять записи
io:
- {dir: ←, with: Harness · Context Manager, what: запрос контекста `GET /context` по задаче и агенту, via: [I11]}
- {dir: ←, with: Harness · Tool Executor, model: [M3Record], what: 'запись `M3Record` — `PUT /m3/:issueId`', via: [I11]}
- {dir: ←, with: Администратор, what: 'удаление записи — `DELETE /records/:level/:id`, сервисный токен'}
- {dir: ←, with: Kubernetes CronJob, what: 'очистка по срокам — `POST /retention/run`, сервисный токен'}
- {dir: →, with: PostgreSQL 17, what: 'чтение M1, M2 и запись M3 через PgBouncer', via: [I22]}
data:
- {table: memory_m3, why: 'чтение и запись (владелец — Memory, роль `memory`)'}
- {table: agent_run, why: чтение итогов запусков (M2) по GRANT (владелец — ICPlan)}
- {table: agent_chat_message, why: чтение переписки в треде (M1) по GRANT (владелец — ICPlan)}
- {table: issue_activity, access: read, why: по GRANT (владелец — ICPlan)}
reqs: [R-MEM-01, R-MEM-04, R-MEM-05, R-MEM-07, R-MEM-08, R-MEM-12, R-MEM-15]
tasks: ['2.5']
failures:
- {when: БД недоступна, then: 'чтение отдаёт пустой контекст с предупреждением, запись повторяется', fmea: agent-memory, reqs: [R-MEM-12]}
- {when: Два запуска пишут M3 одновременно, then: 'сохраняется последняя версия, прежняя остаётся в истории', reqs: [R-MEM-04]}
- {when: Очистка M3 не прошла, then: 'записи остаются, M3 закрытых задач не отдаётся в контекст, уведомление эксплуатации, повтор задания CronJob', fmea: agent-memory}
- {when: Профиль памяти не задан, then: применяются значения по умолчанию из таблицы параметров, reqs: [R-MEM-12]}
- {when: 'Запись с секретом, больше `m3_max_kb` или на уровень вне профиля', then: отклонена с причиной, reqs: [R-MEM-15]}
why: Агенты не ходят в БД напрямую.
rnd: memory-model.md
ops:
- {op: 'контекст запуска: M1, M2, M3 по профилю памяти — `GET /context`', endpoint: GET /context, who: Harness · Context Manager, via: [I11]}
- {op: 'запись M3 с проверками — `PUT /m3/:issueId`', endpoint: 'PUT /m3/:issueId', who: Harness · Tool Executor, via: [I11]}
- {op: 'удаление записи M1–M4 — `DELETE /records/:level/:id`', endpoint: 'DELETE /records/:level/:id', who: Администратор, via: [I11]}
- {op: очистка M3 по срокам — `POST /retention/run`, endpoint: POST /retention/run, who: Kubernetes CronJob, via: [I11]}
