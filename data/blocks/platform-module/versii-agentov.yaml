title: Версии агентов
tech: Таблица версий + экспорт / импорт YAML
kind: service
stories: [US-PM-02, US-PM-03, US-PM-07]
params:
- {name: version, value: последняя}
does:
- История изменений агента
- Перенос dev → prod
- Ревью через YAML
io:
- {dir: ←, label: ICPlan UI, what: 'история, откат, экспорт и импорт YAML', via: [I20]}
- {dir: ←, with: Agent Runner, what: запрос версии запуска; новая версия по хешу определения, via: [I4], decisions: [D26]}
data:
- {table: agent_settings_version, access: read-write, why: 'снимок определения и настроек, автор, время'}
- {table: agent_settings, access: write, why: текущая версия при откате}
- {table: ai_agent, access: read, why: определение для хеша и экспорта}
reqs: [R-CP-04, R-CP-05, R-REG-03, R-REG-04]
tasks: ['4.4']
failures:
- {when: Импорт с неверной схемой или ссылкой на несуществующий объект, then: '400, импорт отклоняется с указанием ссылки', reqs: [R-CP-05]}
- {when: Откат без права `ai_agents`, then: '403', reqs: [R-CP-04]}
- {when: БД платформы (S2) недоступна, then: 'версии не читаются и не создаются, запуск не стартует', fmea: control-plane}
why: Воспроизводимость запусков и ревью без Config Repo.
rnd: config-storage.md
ops:
- {op: '`GET /platform/agents/:agentId/settings/versions`, `POST …/settings/rollback` — история и откат', endpoint: 'GET /platform/agents/:agentId/settings/versions', label: Администратор, via: [I20]}
- {op: '`GET /platform/agents/:agentId/export`, `POST /platform/agents/import` — YAML `agent/v1`', label: Администратор, via: [I20]}
- {op: Новая версия при отличии хеша определения, who: Agent Runner, via: [I4], decisions: [D26]}
