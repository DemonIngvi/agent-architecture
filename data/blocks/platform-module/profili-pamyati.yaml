title: Профили памяти
tech: Профили Memory
kind: service
stories: [US-PM-01]
params:
- {name: memory_profile.read, value: 'M2, M3, M5, M6'}
- {name: memory_profile.write, value: M3}
- {name: memory.m2_last_runs, value: '3'}
- {name: memory.retention, value: 'M1 30 д, M2 180 д, M3 до закрытия задачи, M4 до замены факта'}
does:
- Какие уровни памяти агент читает и пишет, сколько хранить; для M1 и M2 срок — фильтр чтения, строки форка удаляет ICPlan (D25)
io:
- {dir: ←, with: ICPlan UI, what: профили памяти и выбор профиля агента, via: [I20]}
- {dir: →, with: Agent Runner, what: профиль памяти агента в настройках запуска, via: [I4]}
data:
- {table: memory_profile, access: read-write, why: 'уровни чтения и записи, сроки'}
- {table: agent_settings, access: read-write, why: '`memory_profile_id` агента'}
reqs: [R-CP-01, R-CP-03]
tasks: ['4.4']
failures:
- {when: Недопустимое значение профиля, then: 400 с названием поля, reqs: [R-CP-01]}
- {when: 'Удаление профиля, который используется,', then: '409, в ответе агенты с этим профилем (`agent_settings.memory_profile_id`)', reqs: [R-CP-01]}
- {when: Смена профиля во время запуска, then: активный запуск идёт по прежнему, reqs: [R-CP-03]}
why: Баланс преемственности и токенов на агента.
rnd: memory-model.md
ops:
- {op: '`GET /platform/memory-profiles`, `PUT`, `DELETE /platform/memory-profiles/:name` — профили', who: Владелец экземпляра, via: [I20]}
- {op: Профиль агента — `memory_profile` в настройках агента, who: Администратор, via: [I20]}
- {op: Отдать профиль запуска, who: Agent Runner, via: [I4]}
