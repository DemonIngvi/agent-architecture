title: API модуля
tech: Модуль форка ICPlan (TypeScript), схема `platform` в Postgres
kind: service
stories: [US-PM-01, US-PM-02, US-PM-04, US-PM-07]
params:
- {name: concurrency, value: '1'}
- {name: prompt.guidance_max_chars, value: '4000'}
- {name: version, value: последняя}
does:
- 'CRUD наших настроек агента: права по роли ICPlan, проверка границ и потолков, каждое изменение — версия'
- Отдаёт настройки Runner, LiteLLM, OPA
- Отдаёт Runner определение и настройки версии запуска одним ответом — `GET /platform/runs/:runId/agent` (I4, D23); таблицы Registry читает той же ролью `itsaplan`
io:
- {dir: ←, with: ICPlan UI, what: 'настройки агента и проекта, профили, kill switch', via: [I20]}
- {dir: ←, with: Agent Runner, what: запрос определения и настроек версии запуска, via: [I4]}
- {dir: →, with: LiteLLM, what: лимиты и алиасы ключей, via: [I15]}
- {dir: →, with: OPA, what: данные правил — bundle, via: [I16]}
data:
- {table: agent_settings, access: read-write, why: настройки агента}
- {table: agent_settings_version, access: read-write, why: версия при каждом изменении}
- {table: project_platform, access: read-write, why: 'руководство, бюджет, шаг подготовки проекта'}
- {table: project_resource, access: read-write, why: ресурсы проекта}
- {table: access_policy, access: read-write, why: доступы агентов к ресурсам}
- {table: kill_switch, access: read-write, why: аварийная остановка}
- {table: ai_agent, access: read, why: определение агента для ответа Runner}
reqs: [R-CP-01, R-CP-02, R-CP-03, R-CP-07, R-CP-11]
tasks: ['4.4']
failures:
- {when: БД платформы (S2) недоступна, then: 'сохранение настроек отклоняется с причиной, Runner не стартует новые запуски', fmea: control-plane}
- {when: Нет права `ai_agents`, then: 'запрос отклоняется 403, данные не меняются', reqs: [R-CP-07]}
- {when: Значение вне границ или выше потолка L0, then: 400 с названием поля, reqs: [R-CP-01]}
why: Одна БД и одна авторизация с ICPlan.
rnd: config-storage.md
ops:
- {op: '`GET`, `PATCH /platform/agents/:agentId/settings` — настройки агента', endpoint: 'PATCH /platform/agents/:agentId/settings', who: Администратор, via: [I20]}
- {op: '`PUT /platform/projects/:projectKey/guidance`, `/budget`, `/access` — настройки проекта', endpoint: 'PUT /platform/projects/:projectKey/guidance', who: Администратор, via: [I20]}
- {op: определение и настройки версии запуска, endpoint: 'GET /platform/runs/:runId/agent', who: Agent Runner, via: [I4]}
- {op: журнал изменений, endpoint: GET /platform/audit, who: Безопасность, via: [I20]}
