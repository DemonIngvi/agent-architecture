title: OPA
tech: Open Policy Agent v1.21.1 (Apache-2.0)
kind: service
stories: [US-GRD-01, US-GRD-02, US-GRD-06]
params:
- {name: engine, value: opa}
- {name: on_engine_error, value: deny}
- {name: opa.cache_ttl_s, value: '60'}
- {name: bundles.<name>.resource, value: бандл `opa-bundle` (Rego из git + данные Platform module)}
does:
- Решения allow / deny / confirm для G1 (допуск, бюджет) и G2 (действие агента) по `PolicyInput`
- Загружает бандл (Rego из git и данные агентов из Platform module) опросом раз в 30 с; при битом бандле остаётся на прежнем
- Кэширует решение для одинакового входа в запуске на `opa.cache_ttl_s`; каждое решение попадает в аудит с `run_id`
io:
- {dir: ←, with: Agent Runner (Admission), model: [PolicyInput], what: '`PolicyInput` G1', via: [I5]}
- {dir: ←, with: Harness (hooks), model: [PolicyInput], what: '`PolicyInput` G2', via: [I10]}
- {dir: ←, with: Platform module и git (Rego), what: 'bundle: правила и данные агентов', via: [I16]}
- {dir: →, with: Agent Runner и Harness, model: [PolicyDecision], what: '`PolicyDecision`: allow / deny / confirm с причиной и правилом'}
data:
- {table: agent_settings, access: read, why: 'через бандл: `tools_allow`, `approval_tools`, `autonomy_level`, бюджеты агента (владелец — Platform module)'}
- {table: kill_switch, access: read, why: 'через бандл: аварийная остановка платформы и агентов (владелец — Platform module)'}
reqs: [R-GRD-01, R-GRD-02, R-GRD-03, R-GRD-07, R-GRD-08, R-GRD-11, R-GRD-15, R-GRD-16]
tasks: ['4.3']
failures:
- {when: OPA недоступен или ответил медленнее 200 мс, then: 'решение по `on_engine_error`: deny (`policy_unavailable`) по умолчанию, allow с пометкой «без проверки» только в dev (R-GRD-07, FMEA «OPA недоступен»)', reqs: [R-GRD-07]}
- {when: Битый Rego, then: 'OPA остаётся на прежнем бандле, ошибка загрузки видна (FMEA «Битый Rego»)'}
- {when: Нет данных правил агента, then: 'deny всех тулов, кроме явно разрешённых в L0 (FMEA «Нет данных правил агента»)'}
- {when: Хранилище правил недоступно, then: 'OPA работает на последнем загруженном бандле, без бандла — `on_engine_error` (FMEA «Хранилище правил недоступно»)'}
why: Правила как код, тесты, аудит; CNCF graduated (решение D6).
rnd: guardrails-engine.md
ops:
- {op: решение допуска и бюджета, endpoint: POST /v1/data/agent/g1, who: Agent Runner перед созданием sandbox, via: [I5]}
- {op: решение по вызову тула или записи в память, endpoint: POST /v1/data/agent/g2, who: Harness hooks и MCP-прокси Runner, via: [I10]}
- {op: 'bundles API: загрузка `opa-bundle` раз в 30 с', who: OPA, via: [I16]}
