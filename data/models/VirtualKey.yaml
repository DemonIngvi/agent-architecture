purpose: ключ LiteLLM на агента (`/key/generate`)
fields:
- [key_alias, string, true, '`agent:<agentId>`']
- [models, 'string[]', true, разрешённые алиасы]
- [max_budget, float, true, бюджет $ за период = `AgentSettings.budget.dayUsd`]
- [budget_duration, string, true, 'всегда `1d`: бюджет ключа = дневной лимит агента; лимит на запуск проверяет G1']
- [rpm_limit / tpm_limit, int, false, '']
- [metadata, object, false, 'наши ключи в стиле LiteLLM: `agent_id`']
source:
  kind: ext
  ref: https://docs.litellm.ai/docs/proxy/virtual_keys
  why: 'Ключ LiteLLM на агента: бюджет и модели ограничиваются шлюзом, а не кодом агента. Ключ хранится в Secret и подставляется egress-прокси, в среду запуска не попадает (Т5). Имена — API LiteLLM, включая наши ключи `metadata`.'
field_src:
  metadata: 🧩 наши ключи
