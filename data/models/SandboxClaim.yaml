purpose: заявка Runner на среду запуска
fields:
- {name: profile, type: string, required: true, desc: имя профиля среды}
- {name: sandboxId, type: string, required: false, desc: 'в ответе: идентификатор среды, назначает провайдер'}
- {name: image, type: string, required: true, desc: образ Harness из профиля}
- {name: runtime, type: 'enum: runc · runsc', required: true, desc: 'runc — обычный контейнер; runsc — gVisor, изоляция ядра для недоверенного кода', reqs: [R-SBX-05]}
- {name: cpu / memoryMb / diskGb, type: number, required: true, desc: 'ядра, МБ памяти, ГБ диска из профиля'}
- {name: readyMs, type: int, required: false, desc: 'в ответе: время до готовности среды'}
source:
  kind: ours
  refs: [D1, R-SBX-05]
  why: 'Заявка Runner провайдеру среды (Docker, позже Kubernetes): профиль, образ и ресурсы.'
