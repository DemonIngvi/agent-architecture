purpose: шаг процесса (D17, D20)
fields:
- [id, string, true, 'ключ шага в процессе (`sdd`) — колонка `process_step.key`, уникальна в процессе']
- [column, string, true, название колонки проекта (`SDD`)]
- [agentId, int, false, агент шага; нет — ручной шаг]
- [onSuccess / onFailure, '{step} · {process} · {done: true}', true, 'куда переходит задача: на шаг этого процесса по `id`, на первый шаг другого процесса (тип задачи меняется) или завершается']
- [maxRuns, int, false, 'сколько раз шаг может запускаться по одной задаче, 1–10, по умолчанию 3 (R-AP-16); превышен — `onFailure`']
- [requireReview, bool, true, 'итог шага проверяет человек (вердикт), прежде чем задача перейдёт дальше']
- [deliverable, string, false, 'что шаг сдаёт: артефакты и формат (D20)']
- [doneCriteria, 'Criterion[]', false, готовность шага (D20)]
- [criteriaApproval, 'enum: auto · review · always', true, 'как подтверждаются критерии, предложенные агентом (D20): `auto` — без подтверждения, но если у шага `requireReview` или у агента-автора автономия R0–R1, работает как `review`; `review` — подтверждает человек при проверке шага; `always` — подтверждает человек всегда, до запуска шага']
source:
  kind: ours
  ref: D17, D20
  why: 'Шаг = колонка + агент + переходы (D17) и контракт шага (D20): что сдать и как проверить.'
