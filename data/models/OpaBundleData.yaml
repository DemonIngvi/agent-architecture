purpose: данные бандла OPA (`data.json`)
fields:
- [agents.<id>.tools_allow, 'string[]', true, '`<id>` — `agentId`']
- [agents.<id>.approval, 'string[]', true, тулы с паузой]
- [agents.<id>.autonomy, 'enum: R0–R5', true, '']
- [agents.<id>.budget, '{run_usd, day_usd}', true, лимиты $ = `AgentSettings.budget`]
- [projects.<id>.budget.month_usd, number, false, лимит проекта на месяц = `project_platform.budget_month_usd`]
- [platform.kill_switch, bool, true, аварийная остановка всех агентов]
source:
  kind: ours
  ref: D6, R-GRD-01
  why: 'Данные, которые Platform module кладёт в бандл OPA рядом с правилами Rego: что разрешено агенту, где нужна пауза, бюджет и аварийный выключатель. Это выгрузка параметров конфигурации как есть, поэтому имена — как у параметров (`guardrails.tools_allow`, `kill_switch`): их и читают правила Rego.'
