purpose: запуск, выданный раннеру (`POST /agent-runs/claim` → `run`)
fields:
- {name: id, type: int, required: true, desc: '`agent_run.id`'}
- {name: trigger, type: 'enum: mention · delegation · field · schedule · manual · process_step', required: true, desc: 'что создало запуск: упоминание агента в комментарии, назначение делегатом, изменение поля задачи, расписание, ручной запуск; `process_step` — шаг процесса', decisions: [D17]}
- {name: prompt, type: string, required: true, desc: 'задание, собранное ICPlan'}
- {name: systemPrompt, type: string, required: true, desc: правила самого запуска от ICPlan}
- {name: attempts, type: int, required: true, desc: 'сколько раз запуск уже выдавался: аренда `AGENT_RUN_LEASE_SECONDS` = 300 с, Runner продлевает её heartbeat-ом (I3); не продлил — запуск выдаётся снова; после `AGENT_RUN_MAX_ATTEMPTS` = 3 выдач без итога следующий claim завершает его `failed` с `lastError` «Runner did not report a result» (`expireExhaustedRuns` форка)', via: [I3]}
- {name: issueId, type: int | null, required: true, desc: задача; `null` — запуск без задачи (расписание)}
- {name: issueIdentifier, type: string | null, required: true, desc: 'читаемый ключ задачи, `MKT-42`'}
- {name: rule, type: '{process, stepId}', required: false, desc: 'шаг процесса, создавший запуск, при `trigger = process_step` (D17): `process` — название типа задачи (= процесса), `stepId` — `ProcessStep.id`; иначе поля нет', decisions: [D17]}
- {name: parentRunId, type: int | null, required: false, desc: 'запуск, после которого создан этот (возврат, повтор шага): по цепочке `parentRunId` считаются круги и стоимость на принятую задачу (R-OBS-13); у первого запуска `null`', reqs: [R-OBS-13], decisions: [D27]}
- {name: startReason, type: 'enum: first · return · retry · manual', required: false, desc: 'причина запуска: первый вход в шаг, возврат по переходу (R-AP-24), повтор шага (R-AP-21), ручной запуск', reqs: [R-AP-24], decisions: [D27]}
- {name: settingsVersionId, type: int | null, required: false, desc: 'версия настроек агента, на которой запускать (R-REG-03): `null` — последняя на старте; несуществующая — запуск отклоняется с ошибкой версии; пишется в `agent_run.agent_version`', reqs: [R-REG-03], decisions: [D23]}
source:
  kind: fork
  ref: POST /agent-runs/claim
  part: response.run
  why: 'Это ответ форка любому внешнему раннеру: так ICPlan уже выдаёт запуски. `prompt` и `systemPrompt` разделены, потому что раннер передаёт первое как задание, второе — как системные правила. Мы добавляем только `rule` — какой шаг процесса создал запуск (D17): по нему Runner берёт критерии шага, а лента задачи — разделитель шага.'
planned:
  parentRunId: D27
  startReason: D27
  rule: D17
  trigger: D17 (значение `process_step`)
  settingsVersionId: D23 (R-REG-03)
