purpose: вердикт по результату шага (R-AP-19)
fields:
- {name: issueId / stepId, type: int / string, required: true, desc: 'задача и шаг, по которому вердикт'}
- {name: runId, type: int | null, required: false, desc: 'запуск, чей итог оценивается; нет — ручной шаг'}
- {name: verdict, type: 'enum: accepted · rejected', required: true, desc: '`accepted` → переход `onSuccess` шага, `rejected` → `onFailure`'}
- {name: note, type: string, required: false, desc: 'заметка возврата; следующий запуск шага, на который вернули задачу, получает её в `RunBundle.task.returnNote`'}
- {name: by, type: string, required: true, desc: '`username` того, кто вынес вердикт'}
- {name: criteria, type: 'Criterion[]', required: false, desc: критерии ревьюера при возврате, decisions: [D20]}
source:
  kind: ours
  refs: [D20, R-AP-19]
  why: Вердикт шага из карточки итога; при возврате ревьюер может добавить критерии с происхождением `reviewer:<кто>`.
