purpose: доступ к репозиторию на один запуск
fields:
- {name: repo, type: string, required: true, desc: репозиторий `org/name`}
- {name: access, type: 'enum: read · write', required: true, desc: право на репозиторий}
- {name: branchPrefix, type: string, required: true, desc: 'в какие ветки можно писать: `agent/`'}
- {name: protected, type: 'string[]', required: true, desc: ветки без записи}
- {name: ttlSec, type: int, required: true, desc: срок токена; сам токен в модель не входит — его подставляет прокси, reqs: [R-SBX-04]}
source:
  kind: ours
  refs: [D18, R-SBX-04]
  why: 'Короткоживущий доступ к репозиторию на запуск: только ветки с префиксом агента, защищённые ветки без записи.'
