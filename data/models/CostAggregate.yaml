purpose: сводка затрат по задаче и агенту (экран «Затраты», R-OBS-05)
fields:
- {name: issueId, type: int, required: true, desc: 'задача: `run_id` из журнала LiteLLM → `agent_run.issue_id`'}
- {name: agentId, type: int, required: true, desc: 'агент: `agent_run.agent_id`'}
- {name: runs, type: int, required: true, desc: число запусков за всё время задачи; запуски без задачи — в сводке агента (задача 3.9)}
- {name: inputTokens / outputTokens, type: int | null, required: true, desc: 'токены из журнала LiteLLM; `null` — журнал недоступен, «неизвестно»', reqs: [R-OBS-05]}
- {name: costUsd, type: float | null, required: true, desc: 'затраты; `null` — цена модели не задана или журнал недоступен, стоимость неизвестна', reqs: [R-OBS-05]}
source:
  kind: ours
  refs: [R-OBS-05, R-LLM-03]
  why: 'Сводка для экрана затрат: Observability читает журнал LiteLLM (I14) и группирует по `metadata.run_id` → `agent_run`; токены названы как в ICPlan (`inputTokens`, `outputTokens`). `RunResult.usage` — расход одного запуска, сводка — сумма по журналу.'
