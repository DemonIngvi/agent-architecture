purpose: итог запуска (`POST /agent-runs/:runId/result`)
fields:
- {name: status, type: 'enum: success · failed', required: true, desc: 'отмену фиксирует ICPlan сам, раннер её не сообщает'}
- {name: output, type: string | null, required: false, desc: итог для истории; ICPlan обрезает до 10 000 символов}
- {name: error, type: string | null, required: false, desc: причина при `failed`; ICPlan обрезает до 500 символов}
- {name: usage, type: '{inputTokens, outputTokens, reasoningTokens, costUsd, iterations}', required: false, desc: 'расход; `reasoningTokens`, `costUsd`, `iterations` (итерации цикла) — добавляем', decisions: [D18]}
- {name: reason, type: 'enum: done · limit · gate_failed · error', required: false, desc: 'причина Harness (R-RUN-07): `done` → `status = success`; `limit`, `gate_failed`, `error` → `failed`', reqs: [R-RUN-07]}
- {name: artifacts, type: '{name, url}[]', required: false, desc: 'опубликованное для человека: файл в RustFS (`s3://…`), ветка или PR (D20); в M3 — рабочие ссылки `{path, ref}`', decisions: [D20]}
- {name: gate, type: '{passed: bool, failed: Criterion[]}', required: false, desc: 'проверка по критериям (R-HRN-08, D20): не выполненные критерии', reqs: [R-HRN-08], decisions: [D20]}
- {name: criteriaNext, type: 'Criterion[]', required: false, desc: 'критерии, предложенные следующему шагу (D20, D26): Runner берёт их из итога Harness; ICPlan при приёме итога создаёт пункты чек-листа задачи с `origin = agent:<username>` и `status` по `criteriaApproval` шага', decisions: [D20, D26]}
source:
  kind: fork
  ref: POST /agent-runs/{runId}/result
  part: request
  why: 'Тело, которое форк уже принимает от раннера: `status`, `output`, `error`, `usage` с `inputTokens` и `outputTokens`. Добавляем то, без чего не работают D18 и D20: причину Harness, артефакты, проверку по критериям, стоимость и токены размышлений.'
planned:
  usage: D18 (`reasoningTokens`, `costUsd`, `iterations`)
  reason: R-RUN-07
  artifacts: D20
  gate: D20
  criteriaNext: D26
