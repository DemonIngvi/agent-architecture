purpose: запрос к модели (OpenAI Chat Completions через LiteLLM)
fields:
- [model, string, true, алиас из `model_list`]
- [messages, '{role, content}[]', true, слои промпта (R-HRN-18)]
- [tools, '{type, function: {name, parameters}}[]', false, '']
- [tool_choice / parallel_tool_calls, enum / bool, false, 'Harness: `auto`, без параллельных вызовов']
- [temperature / max_tokens / reasoning_effort, number / enum, false, '`model.*`; неподдерживаемое отбрасывает `drop_params`']
- [metadata, '{run_id, issue_key, agent}', true, 'наши ключи для атрибуции затрат (R-LLM-03): `run_id` = `Run.id`, `issue_key` = `issueIdentifier`, `agent` = `username`']
- [stream, bool, false, '']
source:
  kind: ext
  ref: https://platform.openai.com/docs/api-reference/chat/create
  why: Стандартный запрос OpenAI Chat Completions, который LiteLLM принимает для любого провайдера. `metadata` — наши ключи для атрибуции затрат; их имена в стиле LiteLLM, потому что они попадают в его журнал затрат.
field_src:
  metadata: 🧩 наши ключи
