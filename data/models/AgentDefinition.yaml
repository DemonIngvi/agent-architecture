purpose: определение агента в YAML `agent/v1` — экспорт и импорт (R-REG-04, R-CP-05)
fields:
- {name: apiVersion, type: 'const: agent/v1', required: true, desc: версия формата}
- {name: id, type: string, required: true, desc: имя агента (`username` в ICPlan)}
- {name: version, type: int, required: true, desc: версия определения}
- {name: model, type: string, required: true, desc: алиас LiteLLM}
- {name: instructions, type: string, required: true, desc: инструкция агента}
- {name: skills, type: 'string[]', required: false, desc: навыки}
- {name: mcp, type: '{server, tools[]}[]', required: false, desc: 'MCP-серверы и разрешённые тулы; источник — `project_resource` (`mcp`) и `access_policy` Platform module: MCP-серверов агента в форке нет', decisions: [D23]}
- {name: limits, type: '{max_steps, timeout_s, max_tokens}', required: false, desc: параметры `limits.*`}
- {name: approval, type: '{tools[]}', required: false, desc: тулы с подтверждением}
- {name: memory, type: '{profile, read[], write[]}', required: false, desc: профиль памяти}
- {name: sandbox, type: '{profile}', required: false, desc: профиль среды}
source:
  kind: ours
  ref: R-REG-04, R-CP-05, задача 1.2
  why: 'Файл для ревью и переноса агента между окружениями: снимок `ai_agent` (ICPlan) и `AgentSettings` (Platform module), источник правды — они, файл только читается и импортируется. Агент в файле — `id` = `username`, потому что числовой `agentId` в другом окружении другой. Имена — как у параметров конфигурации: YAML snake_case (`limits.max_steps`, `memory.read` — уровни памяти M0–M6), единицы — суффиксом `_s`. Исключение — `apiVersion`: заголовок формата, как в манифестах Kubernetes.'
