purpose: состояние задачи и передача следующему шагу (R-MEM-04, D20)
fields:
- {name: issueId, type: int, required: true, desc: 'задача, = `issue.id`; ключ записи — (задача, область)'}
- {name: scope, type: 'enum: issue · agent · project · team', required: true, desc: 'кто видит запись (R-MEM-02): агенты этой задачи, этот агент в других задачах, проект, команда'}
- {name: agentId, type: int, required: true, desc: автор записи}
- {name: done, type: 'string[]', required: true, desc: сделано}
- {name: next, type: 'string[]', required: true, desc: дальше}
- {name: blockers, type: 'string[]', required: false, desc: что мешает продолжить}
- {name: artifacts, type: '{path, ref}[]', required: false, desc: 'артефакты: путь и ветка@коммит'}
- {name: questions, type: 'string[]', required: false, desc: открытые вопросы}
- {name: criteriaNext, type: 'Criterion[]', required: false, desc: 'критерии, предложенные следующему шагу'}
- {name: version, type: int, required: true, desc: версия записи для конкурентной записи}
source:
  kind: ours
  refs: [R-MEM-04, D20]
  why: 'M3 — память состояния задачи и передача между шагами: «сделано / дальше / блокеры» и ссылки на артефакты вместо содержимого. Harness пишет её в Memory API (отдельный сервис платформы) по токену запуска, а не в БД; Memory API хранит её в `memory_m3` по ключу (задача, область), `version` защищает от одновременной записи.'
