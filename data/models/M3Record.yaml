purpose: состояние задачи и передача следующему шагу (R-MEM-04, D20)
fields:
- [issueId, int, true, 'задача, = `issue.id`; ключ записи — (задача, область)']
- [scope, 'enum: issue · agent · project · team', true, 'кто видит запись (R-MEM-02): агенты этой задачи, этот агент в других задачах, проект, команда']
- [agentId, int, true, автор записи]
- [done, 'string[]', true, сделано]
- [next, 'string[]', true, дальше]
- [blockers, 'string[]', false, что мешает продолжить]
- [artifacts, '{path, ref}[]', false, 'артефакты: путь и ветка@коммит']
- [questions, 'string[]', false, открытые вопросы]
- [criteriaNext, 'Criterion[]', false, 'критерии, предложенные следующему шагу']
- [version, int, true, версия записи для конкурентной записи]
source:
  kind: ours
  ref: R-MEM-04, D20
  why: 'M3 — память состояния задачи и передача между шагами: «сделано / дальше / блокеры» и ссылки на артефакты вместо содержимого. Harness пишет её в Memory API (отдельный сервис платформы) по токену запуска, а не в БД; Memory API хранит её в `memory_m3` по ключу (задача, область), `version` защищает от одновременной записи.'
