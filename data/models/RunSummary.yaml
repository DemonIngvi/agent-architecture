purpose: итог прошлого запуска для памяти M2 — строка `agent_run` форка
fields:
- [id, int, true, '`agent_run.id`, как в API аналитики ICPlan']
- [agentId, int, true, агент]
- [status, 'enum: pending · success · failed · canceled', true, '`agent_run.status`']
- [output, string | null, false, 'итог; в контекст попадает в пределах окна модели (управление контекстом, R-HRN-07)']
- [lastError, string | null, false, причина неудачи (`agent_run.last_error`)]
- [inputTokens / outputTokens, int | null, false, токены запуска]
- [finishedAt, timestamp | null, false, время завершения]
source:
  kind: ours
  ref: R-MEM-03, R-MEM-05
  why: 'M2 (эпизодическая память: итоги прошлых запусков) не хранится отдельно: это строки `agent_run` форка: ICPlan пишет их сам при выдаче и завершении запуска (`POST …/result`). Модель наша, данные и имена — форка (`GET /projects/:projectKey/analytics/agent-runs`: `id`, `agentId`, `lastError`).'
