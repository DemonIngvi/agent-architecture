purpose: итог прошлого запуска для памяти M2 — строка `agent_run` форка
fields:
- {name: id, type: int, required: true, desc: '`agent_run.id`, как в API аналитики ICPlan'}
- {name: agentId, type: int, required: true, desc: агент}
- {name: status, type: 'enum: pending · success · failed · canceled', required: true, desc: '`agent_run.status`'}
- {name: output, type: string | null, required: false, desc: 'итог; в контекст попадает в пределах окна модели (управление контекстом, R-HRN-07)', reqs: [R-HRN-07]}
- {name: lastError, type: string | null, required: false, desc: причина неудачи (`agent_run.last_error`)}
- {name: inputTokens / outputTokens, type: int | null, required: false, desc: токены запуска}
- {name: finishedAt, type: timestamp | null, required: false, desc: время завершения}
source:
  kind: ours
  refs: [R-MEM-03, R-MEM-05]
  why: 'M2 (эпизодическая память: итоги прошлых запусков) не хранится отдельно: это строки `agent_run` форка: ICPlan пишет их сам при выдаче и завершении запуска (`POST …/result`). Модель наша, данные и имена — форка (`GET /projects/:projectKey/analytics/agent-runs`: `id`, `agentId`, `lastError`).'
field_src:
