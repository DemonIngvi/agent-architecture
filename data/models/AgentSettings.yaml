purpose: настройки агента из Platform module (I4)
fields:
- {name: agentId, type: int, required: true, desc: агент}
- {name: version, type: int, required: true, desc: 'единая версия агента: растёт при любой правке определения или настроек (R-CP-04); та же в `AgentDefinition.version` и `RunBundle.agent.version`'}
- {name: autonomy, type: 'enum: R0–R5', required: true, desc: 'уровень автономии: R0 — каждое действие с подтверждением … R5 — без подтверждений'}
- {name: budget, type: '{runUsd, dayUsd}', required: true, desc: 'лимиты агента в $: на запуск и на день'}
- {name: sandboxProfile, type: string, required: true, desc: имя профиля среды (`sandbox_profile.name`)}
- {name: memoryProfile, type: string, required: true, desc: имя профиля памяти}
- {name: toolsAllow / approvalTools, type: 'string[]', required: true, desc: разрешённые тулы и тулы с подтверждением; в бандл OPA уходят как `tools_allow` и `approval`}
- {name: scheduling, type: '{parallel, max}', required: false, desc: '`parallel` — сколько запусков агента идёт одновременно; `max` — сколько запусков агента может ждать в очереди'}
source:
  kind: ours
  refs: [D9, R-CP-04]
  why: 'Наши настройки агента, которых нет в ICPlan; источник правды для автономии, бюджета, тулов и профилей. Включён ли агент — не здесь: источник правды один, `ai_agent.enabled` ICPlan (D17, R-ICP-17); аварийная остановка — `kill_switch` (`agent:<id>`). Из них собираются бандл OPA (`OpaBundleData`, имена конфигурации) и файл экспорта (`AgentDefinition`). Версия нужна для отката и для того, чтобы запуск видел настройки версии, закреплённой при первом вызове I4 (D23).'
