purpose: вход OPA (G1, G2)
fields:
- [point, 'enum: g1 · g2', true, 'G1 — допуск запуска, G2 — проверка действия агента']
- [agentId, int, true, 'агент; по нему правило находит `data.agents[<agentId>]`']
- [run, '{id, issueId, stepId}', true, 'запуск, задача (или `null`), шаг процесса (или `null`, если запуск не по процессу)']
- [tool / argsHash, string, false, 'для G2: тул и SHA-256 его аргументов']
- [spent, '{dayUsd, monthUsd}', false, 'для G1: потрачено агентом за день и проектом за месяц (считает Runner по журналу LiteLLM); лимиты, автономию и тулы правило берёт из данных бандла']
source:
  kind: ours
  ref: D6, R-GRD-01
  why: 'Содержимое наше: точка G1 или G2, агент, запуск, тул и потраченный бюджет; конверт `{input: …}` задаёт REST API OPA. Вместо аргументов тула — их хеш, чтобы в аудите не было данных. Лимиты сюда не передаются: правило берёт их из данных бандла по `agentId`.'
