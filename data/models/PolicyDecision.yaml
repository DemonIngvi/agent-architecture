purpose: решение OPA
fields:
- [allow, bool, true, можно ли выполнить сразу; при `true` поле `approval` = `false`]
- [approval, bool, true, 'при `allow = false`: `true` — можно после подтверждения человеком (пауза), `false` — запрещено']
- [reason, string, true, причина для аудита и ленты]
source:
  kind: ours
  ref: D6, R-GRD-03
  why: 'Ответ нашего правила Rego, OPA кладёт его в `{result: …}`. Три исхода: выполнить сразу (`allow`), после подтверждения (`approval`), запрещено.'
