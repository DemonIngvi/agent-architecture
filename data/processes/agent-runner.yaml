processes:
- title: Запуск из очереди
  stories: [US-RUN-01, US-RUN-03]
  lanes: [ICPlan, Agent Runner, Sandbox / Harness]
  steps:
  - {id: s, lane: 0, type: start, label: Запуск в очереди, next: [t1]}
  - {id: t1, lane: 1, type: task, label: 'Опрос, аренда', next: [g1]}
  - {id: g1, lane: 1, type: gateway, label: 'Слоты свободны?', next: [{to: g2, label: да}, {to: t1, label: ждать}]}
  - {id: g2, lane: 1, type: gateway, label: 'G1 допуск?', next: [{to: t2, label: да}, {to: x1, label: нет}]}
  - {id: x1, lane: 0, type: error, label: 'Отказ: бюджет / kill'}
  - {id: t2, lane: 2, type: task, label: 'Среда из пула, Harness', next: [g3]}
  - {id: g3, lane: 2, type: gateway, label: 'Итог?', next: [{to: t3, label: done}, {to: x2, label: error / limit}]}
  - {id: x2, lane: 1, type: error, label: failed / limit}
  - {id: t3, lane: 1, type: task, label: 'Итог в ICPlan, destroy', next: [e1]}
  - {id: e1, lane: 0, type: end, label: Задача обновлена}
  artifacts:
    t1: [аренда запуска]
    g2: [PolicyDecision]
    x1: [RunEvent (отказ)]
    t2: [SandboxClaim, RepoGrant, RunBundle]
    t3: [RunResult, запись M2, комментарий]
- title: 'Эксплуатация: режим, ожидание, падение, вывод из работы'
  stories: [US-RUN-02, US-RUN-04, US-RUN-05, US-RUN-06]
  lanes: [Эксплуатация, Agent Runner, ICPlan]
  steps:
  - {id: s, lane: 1, type: start, label: Runner работает, next: [g]}
  - {id: g, lane: 1, type: gateway, label: Событие, next: [{to: md, label: смена режима}, {to: ap, label: ждёт approve}, {to: cr, label: падение}, {to: dr, label: обновление}, {to: sx, label: слоты недоступны}]}
  - {id: md, lane: 0, type: task, label: sequential / parallel, next: [e]}
  - {id: ap, lane: 1, type: task, label: Освободить глобальный и модельный слоты, next: [e]}
  - {id: cr, lane: 2, type: task, label: Аренда истекла → запуск снова в очереди, next: [e]}
  - {id: dr, lane: 0, type: task, label: 'Не брать новые, доделать активные', next: [dg]}
  - {id: dg, lane: 0, type: gateway, label: 'Активные завершились до таймаута вывода?', next: [{to: e, label: да}, {to: dx, label: нет}]}
  - {id: dx, lane: 0, type: error, label: 'Таймаут вывода: оставшиеся запуски возвращаются в очередь'}
  - {id: sx, lane: 2, type: error, label: 'Хранилище слотов недоступно: новые не стартуют, активные идут'}
  - {id: e, lane: 1, type: end, label: Очередь разбирается}
  artifacts:
    md: [конфиг деплоя]
    ap: [освобождённые слоты]
    cr: [запуск pending]
    dr: [Runner готов к остановке]
