processes:
- title: Проверка действия
  stories: [US-GRD-01, US-GRD-02, US-GRD-06]
  lanes: [Runner / Harness, OPA, Администратор]
  steps:
  - {id: s, lane: 0, type: start, label: Действие агента, next: [g1]}
  - {id: g1, lane: 0, type: gateway, label: 'Точка включена?', next: [{to: t1, label: да}, {to: e0, label: нет}]}
  - {id: e0, lane: 0, type: end, label: Без проверки}
  - {id: t1, lane: 1, type: task, label: Решение по Rego, next: [g2]}
  - {id: g2, lane: 1, type: gateway, label: 'Ответ?', next: [{to: e1, label: allow}, {to: t2, label: confirm}, {to: x1, label: deny / сбой}]}
  - {id: t2, lane: 2, type: task, label: Подтверждение человеком, next: [{to: e1, label: да}, {to: x1, label: нет}]}
  - {id: x1, lane: 0, type: error, label: Отказ + аудит}
  - {id: e1, lane: 0, type: end, label: Выполнить}
  artifacts:
    t1: [PolicyDecision]
    t2: [ApprovalDecision]
    x1: [запись аудита]
- title: Бюджеты, аварийная остановка, журнал
  stories: [US-GRD-03, US-GRD-04, US-GRD-05]
  lanes: [Владелец продукта / Эксплуатация / Безопасность, Guardrails]
  steps:
  - {id: s, lane: 1, type: start, label: Расход или инцидент, next: [g]}
  - {id: g, lane: 1, type: gateway, label: 'Что?', next: [{to: b, label: бюджет}, {to: k, label: инцидент}, {to: j, label: разбор}, {to: x, label: нет данных}]}
  - {id: b, lane: 1, type: task, label: Отказ G1 / стоп при аномалии, next: [e]}
  - {id: x, lane: 1, type: error, label: 'Нет данных правил агента: deny всех тулов, кроме разрешённых в L0'}
  - {id: k, lane: 0, type: task, label: Kill switch агента или платформы, next: [e]}
  - {id: j, lane: 0, type: task, label: Журнал срабатываний, next: [e]}
  - {id: e, lane: 1, type: end, label: Под контролем}
  artifacts:
    b: [событие отказа]
    k: [отменённые запуски]
    j: [выборка журнала]
