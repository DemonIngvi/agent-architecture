processes:
- title: Проверка действия
  stories: [US-GRD-01, US-GRD-02, US-GRD-06]
  lanes: [Runner / Harness, OPA, Администратор]
  steps:
  - [s, 0, start, Действие агента, [[g1, '']]]
  - [g1, 0, gateway, 'Точка включена?', [[t1, да], [e0, нет]]]
  - [e0, 0, end, Без проверки, []]
  - [t1, 1, task, Решение по Rego, [[g2, '']]]
  - [g2, 1, gateway, 'Ответ?', [[e1, allow], [t2, confirm], [x1, deny / сбой]]]
  - [t2, 2, task, Подтверждение человеком, [[e1, да], [x1, нет]]]
  - [x1, 0, error, Отказ + аудит, []]
  - [e1, 0, end, Выполнить, []]
  artifacts:
    t1: [PolicyDecision]
    t2: [ApprovalDecision]
    x1: [запись аудита]
- title: Бюджеты, аварийная остановка, журнал
  stories: [US-GRD-03, US-GRD-04, US-GRD-05]
  lanes: [Владелец продукта / Эксплуатация / Безопасность, Guardrails]
  steps:
  - [s, 1, start, Расход или инцидент, [[g, '']]]
  - [g, 1, gateway, 'Что?', [[b, бюджет], [k, инцидент], [j, разбор], [x, нет данных]]]
  - [b, 1, task, Отказ G1 / стоп при аномалии, [[e, '']]]
  - [x, 1, error, 'Нет данных правил агента: deny всех тулов, кроме разрешённых в L0', []]
  - [k, 0, task, Kill switch агента или платформы, [[e, '']]]
  - [j, 0, task, Журнал срабатываний, [[e, '']]]
  - [e, 1, end, Под контролем, []]
  artifacts:
    b: [событие отказа]
    k: [отменённые запуски]
    j: [выборка журнала]
