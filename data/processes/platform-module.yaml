processes:
- title: Изменение настроек агента
  stories: [US-PM-01, US-PM-02, US-PM-04, US-PM-05, US-PM-06, US-PM-08]
  lanes: [Администратор, Platform module, LiteLLM / OPA]
  steps:
  - [s, 0, start, Изменить настройки, [[g1, '']]]
  - [g1, 1, gateway, 'Значения верны?', [[t1, да], [x1, нет]]]
  - [x1, 0, error, Ошибка поля, []]
  - [t1, 1, task, Новая версия, [[t2, '']]]
  - [t2, 2, task, Раздать настройки, [[g2, '']]]
  - [g2, 2, gateway, 'Применено?', [[e1, да], [t3, нет]]]
  - [t3, 1, task, '«Не применено», повтор', [[t2, '']]]
  - [e1, 1, end, Действует со след. запуска, []]
  artifacts:
    t1: [AgentDefinition (версия), AgentSettings]
    t2: [virtual key, OPA bundle]
    t3: [событие «не применено»]
- title: Перенос агента и журнал изменений
  stories: [US-PM-03, US-PM-07]
  lanes: [Администратор / Безопасность, Platform module]
  steps:
  - [s, 0, start, Перенести агента, [[ex, '']]]
  - [ex, 1, task, Экспорт YAML, [[im, '']]]
  - [im, 1, gateway, 'Импорт: связи верны?', [[vr, да], [x, нет]]]
  - [x, 0, error, Ошибка по полю, []]
  - [vr, 1, task, 'Новая версия, журнал', [[au, '']]]
  - [au, 0, task, Просмотр журнала изменений, [[e, '']]]
  - [e, 0, end, Изменения видны, []]
  artifacts:
    ex: [YAML агента]
    vr: [версия определения, запись журнала]
