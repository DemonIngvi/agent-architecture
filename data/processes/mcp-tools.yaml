processes:
- title: Вызов тула
  stories: [US-MCP-02, US-MCP-03]
  lanes: [Harness, Tool Executor, MCP-сервер]
  steps:
  - [s, 0, start, Модель просит тул, [[g1, '']]]
  - [g1, 1, gateway, 'В allowlist?', [[t1, да], [x1, нет]]]
  - [x1, 0, error, Отказ в контекст, []]
  - [t1, 2, task, tools/call, [[g2, '']]]
  - [g2, 1, gateway, 'Ответ вовремя?', [[t2, да], [t3, таймаут]]]
  - [t3, 1, task, Ошибка тула, [[e1, '']]]
  - [t2, 1, task, 'Обрезать, вернуть', [[e1, '']]]
  - [e1, 0, end, Следующий шаг, []]
  artifacts:
    t1: [tools/call]
    t2: [результат тула]
    t3: [ошибка тула]
- title: Подключение серверов, навыков и проверка прав
  stories: [US-MCP-01, US-MCP-04, US-MCP-05]
  lanes: [Администратор / Безопасность, MCP / Tools]
  steps:
  - [s, 0, start, Нужен новый тул или навык, [[rg, '']]]
  - [rg, 1, gateway, 'Сервер отвечает?', [[al, да], [x, нет]]]
  - [x, 0, error, Ошибка регистрации, []]
  - [al, 0, task, 'Allowlist тулов агенту, навыки', [[rv, '']]]
  - [rv, 0, task, 'Проверка прав: агент × тулы', [[e, '']]]
  - [e, 1, end, Со следующего запуска, []]
  artifacts:
    al: [набор тулов агента, навыки]
    rv: [матрица агент × тулы]
