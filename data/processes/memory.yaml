processes:
- title: 'Память на всех уровнях M0–M6: кто пишет и кто читает'
  stories: [US-MEM-01, US-MEM-02, US-MEM-03, US-MEM-04, US-MEM-05, US-MEM-06, US-MEM-07, US-MEM-08, US-MEM-09, US-MEM-10]
  lanes: ['Люди (пользователь, администратор)', ICPlan / Runner, Memory, Harness (агент)]
  steps:
  - [s, 3, start, Старт запуска, [[m5, '']]]
  - [m5, 3, task, 'Собрать агента: инструкция, навыки (M5)', [[pr, '']]]
  - [pr, 2, gateway, 'Профиль: уровни доступны?', [[rd, да], [x1, нет]]]
  - [x1, 2, task, 'Уровень пропущен, предупреждение', [[m0, '']]]
  - [rd, 2, task, 'Контекст: M1, M2, M3', [[m0, '']]]
  - [m0, 3, task, 'Работа в M0, сжатие при 80%', [[m6, '']]]
  - [m6, 3, task, Читать документ (M6), [[m3, '']]]
  - [m3, 3, task, Записать состояние (M3), [[m1, '']]]
  - [m1, 1, task, Сообщения → M1 автоматически, [[en, '']]]
  - [en, 1, task, Итог запуска → M2; M0 уничтожен, [[vd, '']]]
  - [vd, 0, task, Вердикт пользователя → M2, [[rt, '']]]
  - [rt, 2, task, Очистка по срокам M1–M3, [[e, '']]]
  - [e, 2, end, Память обновлена, []]
  artifacts:
    m5: [инструкция и навыки версии запуска]
    rd: [контекст M1–M3 в RunBundle]
    x1: [событие «уровень недоступен»]
    m0: ['рабочий контекст, итог сжатия']
    m6: [вывод `get_document`]
    m3: ['`M3Record`']
    m1: [сообщения треда (M1)]
    en: ['`agent_run` с итогом (M2)']
    vd: [вердикт и заметка в M2]
    rt: [запись журнала удаления]
artifacts:
  t2: [контекст M2 / M3]
  t4: [M3Record]
