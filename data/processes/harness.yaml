processes:
- title: Агентский цикл
  stories: [US-HAR-01, US-HAR-02, US-HAR-03]
  lanes: [Пользователь, Harness, LiteLLM / MCP / OPA]
  steps:
  - {id: s, lane: 1, type: start, label: RunBundle, next: [t1]}
  - {id: t1, lane: 1, type: task, label: Собрать контекст, next: [t2]}
  - {id: t2, lane: 2, type: task, label: Вызов модели, next: [g1]}
  - {id: g1, lane: 1, type: gateway, label: 'Тулы?', next: [{to: g2, label: да}, {to: g3, label: нет}]}
  - {id: g2, lane: 2, type: gateway, label: G2 решение, next: [{to: t3, label: allow}, {to: t4, label: confirm}, {to: t1, label: deny}]}
  - {id: t4, lane: 0, type: task, label: Подтверждение, next: [{to: t3, label: да}, {to: t1, label: нет}]}
  - {id: t3, lane: 2, type: task, label: Вызов тула, next: [t1]}
  - {id: g3, lane: 1, type: gateway, label: 'Quality gate?', next: [{to: e1, label: пройден}, {to: x1, label: не пройден}]}
  - {id: x1, lane: 1, type: error, label: gate_failed}
  - {id: e1, lane: 1, type: end, label: RunResult}
  artifacts:
    t1: [контекст (M0)]
    t2: [chat.completions, spend log]
    g2: [PolicyDecision]
    t4: [ApprovalDecision]
    t3: [результат тула]
    x1: [отчёт gate]
    e1: [RunResult]
- title: Пауза, указания, лимиты, восстановление
  stories: [US-HAR-04, US-HAR-05, US-HAR-06, US-HAR-07]
  lanes: [Пользователь, Harness, Guardrails / checkpoint]
  steps:
  - {id: s, lane: 1, type: start, label: Шаг цикла, next: [g]}
  - {id: g, lane: 1, type: gateway, label: 'Что случилось?', next: [{to: q, label: нужен ответ}, {to: m, label: указание}, {to: l, label: лимит / цикл}, {to: c, label: падение}]}
  - {id: q, lane: 0, type: task, label: Вопрос → ответ пользователя, next: [e]}
  - {id: m, lane: 0, type: task, label: Указание в контекст, next: [e]}
  - {id: l, lane: 2, type: error, label: 'Стоп: limit / цикл'}
  - {id: c, lane: 2, type: task, label: Продолжить с checkpoint, next: [e]}
  - {id: e, lane: 1, type: end, label: Цикл продолжается}
  artifacts:
    q: [вопрос и ответ в M1]
    m: [сообщение в контексте]
    c: [checkpoint]
