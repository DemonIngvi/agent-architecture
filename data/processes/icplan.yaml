processes:
- title: Задача идёт по процессу
  stories: [US-ICP-01, US-ICP-08, US-ICP-09, US-ICP-19, US-ICP-07, US-ICP-29, US-ICP-03, US-ICP-02, US-ICP-11]
  lanes: [Пользователь, ICPlan, Agent Runner]
  steps:
  - [s, 0, start, Задача создана или вошла в шаг, [[g1, '']]]
  - [g1, 1, gateway, 'У шага есть агент?', [[t1, да], [h1, нет]]]
  - [h1, 0, task, Человек делает шаг, [[e0, '']]]
  - [e0, 0, end, Человек переводит задачу, []]
  - [t1, 1, task, Делегат + запуск в очередь агента, [[q1, '']]]
  - [q1, 1, gateway, 'Постановка удалась?', [[t2, да], [xq, 'нет, после повторов']]]
  - [xq, 1, error, 'Запуск не поставлен: запись в истории, уведомление (R-AP-12)', []]
  - [t2, 2, task, Взять из очереди (аренда) и исполнить, [[g2, '']]]
  - [g2, 2, gateway, Итог запуска, [[t4, успех], [t3, ждёт ответа], [x1, 'ошибка, gate, лимит'], [rr, 'Runner упал, аренда истекла'], [xc, отменён человеком]]]
  - [t3, 0, gateway, 'Ответ или решение до `approval_timeout`?', [[t2, 'да, продолжить'], [ta, нет]]]
  - [ta, 1, task, 'Отказ по таймауту, запись в ленте (R-HRN-05)', [[t2, продолжить без действия]]]
  - [rr, 1, gateway, 'Выдач меньше `AGENT_RUN_MAX_ATTEMPTS` (3)?', [[t2, 'да, выдать снова'], [x1, 'нет: failed']]]
  - [xc, 1, error, 'Запуск canceled, среда уничтожена, запись в истории (R-ICP-07)', []]
  - [t4, 1, task, 'Итог в задачу, переход при успехе', [[g3, '']]]
  - [x1, 1, task, 'Переход при ошибке, уведомить владельца', [[e2, '']]]
  - [g3, 1, gateway, 'Куда переход?', [[g1, следующий шаг / другой процесс], [e1, завершить]]]
  - [e2, 0, end, Владелец процесса разбирает, []]
  - [e1, 1, end, Процесс завершён, []]
  artifacts:
    s: [Задача (тип = процесс)]
    t1: [Run (pending), запись истории «шаг»]
    t2: [RunBundle, RunEvent]
    t3: [ApprovalDecision]
    t4: [RunResult, комментарий, вложения, запись истории «переход»]
    x1: [уведомление, запись истории «ошибка шага»]
    h1: [изменения задачи]
    e1: [задача в колонке completed]
- title: Управление ходом задачи пользователем
  stories: [US-ICP-10, US-ICP-12, US-ICP-13, US-ICP-14, US-ICP-04, US-ICP-15, US-ICP-16, US-ICP-17, US-ICP-18]
  lanes: [Пользователь, ICPlan, Agent Runner / Harness]
  steps:
  - [s, 1, start, Шаг завершён или идёт, [[pm, '']]]
  - [pm, 1, gateway, 'Есть право на задачу?', [[g, да], [x403, нет]]]
  - [x403, 1, error, Нет права (403), []]
  - [g, 0, gateway, 'Что делает пользователь?', [[ca, указание], [st, остановить], [rv, проверка], [rp, повтор / передать], [sv, сводка]]]
  - [ca, 1, gateway, 'Запуск ещё идёт?', [[ch, да], [x409, нет]]]
  - [x409, 1, error, 'Запуск завершён (409): указание — новым запуском', []]
  - [ch, 2, task, Указание в активный запуск, [[e, '']]]
  - [st, 1, task, 'Остановить процесс, отменить запуск', [[e, '']]]
  - [rv, 1, gateway, Вердикт, [[ok, принято], ['no', не выполнено]]]
  - [ok, 1, task, Переход при успехе, [[e, '']]]
  - ['no', 2, task, Повтор шага с заметкой, [[e, '']]]
  - [rp, 1, gateway, 'Повтор возможен?', [[rpd, да], [rpx, нет]]]
  - [rpx, 1, error, Лимит шага или процесс остановлен (409), []]
  - [rpd, 1, task, Повтор / с шага N / другой исполнитель, [[e, '']]]
  - [sv, 0, task, 'Сводка: в работе, время, $; почему не берут', [[e, '']]]
  - [e, 1, end, Ход задачи изменён, []]
  artifacts:
    ch: ['сообщение, прикреплённое к запуску']
    st: [флаг `process_paused`, запуск canceled]
    ok: [запись истории «принято»]
    'no': [заметка возврата, новый Run]
    rpd: [новый Run, запись истории]
    sv: [сводка (3.9)]
- title: 'Агент: создать, проверить, изменить, выключить, удалить'
  stories: [US-ICP-20, US-ICP-24, US-ICP-21, US-ICP-22, US-ICP-23, US-ICP-28, US-ICP-06]
  lanes: [Администратор, ICPlan, Agent Runner]
  steps:
  - [s, 0, start, Нужен агент, [[cr, '']]]
  - [cr, 1, task, Создать агента (external), [[vl, '']]]
  - [vl, 1, gateway, 'Связи верны?', [[ts, да], [x, нет]]]
  - [x, 0, error, Ошибка поля, []]
  - [ts, 2, task, Проверка в чате (mock), [['on', '']]]
  - ['on', 2, gateway, 'Runner в сети?', [[wk, да], [of, нет]]]
  - [of, 1, task, Статус «не в сети», [[wk, '']]]
  - [wk, 1, task, 'Работа, статистика', [[ch, '']]]
  - [ch, 0, gateway, Действие администратора, [[ed, изменить], [ds, выключить], [da, удалить]]]
  - [da, 1, gateway, 'Есть активные запуски?', [[wr, да], [dl, нет]]]
  - [wr, 0, task, Предупреждение; после подтверждения запуски отменены, [[dl, '']]]
  - [ed, 1, task, Новая версия, [[e, '']]]
  - [ds, 1, task, 'Выключен: очередь ждёт', [[e, '']]]
  - [dl, 1, task, 'Удалён: шаги ручные', [[e, '']]]
  - [e, 1, end, Агент обновлён, []]
  artifacts:
    cr: [определение агента, ключ агента]
    ts: [тестовый тред чата]
    wk: [статистика агента]
    ed: [версия определения]
    ds: ['`agent.enabled = false`']
    dl: [шаги процессов без агента]
- title: 'Процесс: создать, изменить, подключить агента, Действие'
  stories: [US-ICP-05, US-ICP-25, US-ICP-26, US-ICP-27]
  lanes: [Администратор, ICPlan]
  steps:
  - [s, 0, start, Нужен процесс, [[ed, '']]]
  - [ed, 0, task, 'Шаги, агенты, переходы', [[vl, '']]]
  - [vl, 1, gateway, 'Структура верна?', [[tk, да], [x, нет]]]
  - [x, 1, error, Ошибка с шагом, []]
  - [tk, 1, gateway, 'Есть задачи на удалённых шагах?', [[mv, да], [sv, нет]]]
  - [mv, 0, task, Указать шаг для переноса, [[sv, '']]]
  - [sv, 1, task, Новая версия процесса, [[na, '']]]
  - [na, 0, gateway, 'Нужно Действие по условию?', [[ac, да], [e, нет]]]
  - [ac, 0, task, Действие «делегировать агенту» (необязательно), [[e, '']]]
  - [e, 1, end, Процесс действует, []]
  artifacts:
    ed: [черновик процесса]
    mv: [перенос задач]
    sv: [версия процесса]
    ac: [Действие проекта]
