processes:
- title: Задача идёт по процессу
  stories: [US-ICP-01, US-ICP-08, US-ICP-09, US-ICP-19, US-ICP-07, US-ICP-29, US-ICP-03, US-ICP-02, US-ICP-11]
  lanes: [Пользователь, ICPlan, Agent Runner]
  steps:
  - {id: s, lane: 0, type: start, label: Задача создана или вошла в шаг, next: [g1]}
  - {id: g1, lane: 1, type: gateway, label: 'У шага есть агент?', next: [{to: t1, label: да}, {to: h1, label: нет}]}
  - {id: h1, lane: 0, type: task, label: Человек делает шаг, next: [e0]}
  - {id: e0, lane: 0, type: end, label: Человек переводит задачу}
  - {id: t1, lane: 1, type: task, label: Делегат + запуск в очередь агента, next: [q1]}
  - {id: q1, lane: 1, type: gateway, label: 'Постановка удалась?', next: [{to: t2, label: да}, {to: xq, label: 'нет, после повторов'}]}
  - {id: xq, lane: 1, type: error, label: 'Запуск не поставлен: запись в истории, уведомление (R-AP-12)'}
  - {id: t2, lane: 2, type: task, label: Взять из очереди (аренда) и исполнить, next: [g2]}
  - {id: g2, lane: 2, type: gateway, label: Итог запуска, next: [{to: t4, label: успех}, {to: t3, label: ждёт ответа}, {to: x1, label: 'ошибка, gate, лимит'}, {to: rr, label: 'Runner упал, аренда истекла'}, {to: xc, label: отменён человеком}]}
  - {id: t3, lane: 0, type: gateway, label: 'Ответ или решение до `approval_timeout`?', next: [{to: t2, label: 'да, продолжить'}, {to: ta, label: нет}]}
  - {id: ta, lane: 1, type: task, label: 'Отказ по таймауту, запись в ленте (R-HRN-05)', next: [{to: t2, label: продолжить без действия}]}
  - {id: rr, lane: 1, type: gateway, label: 'Выдач меньше `AGENT_RUN_MAX_ATTEMPTS` (3)?', next: [{to: t2, label: 'да, выдать снова'}, {to: x1, label: 'нет: failed'}]}
  - {id: xc, lane: 1, type: error, label: 'Запуск canceled, среда уничтожена, запись в истории (R-ICP-07)'}
  - {id: t4, lane: 1, type: task, label: 'Итог в задачу, переход при успехе', next: [g3]}
  - {id: x1, lane: 1, type: task, label: 'Переход при ошибке, уведомить владельца', next: [e2]}
  - {id: g3, lane: 1, type: gateway, label: 'Куда переход?', next: [{to: g1, label: следующий шаг / другой процесс}, {to: e1, label: завершить}]}
  - {id: e2, lane: 0, type: end, label: Владелец процесса разбирает}
  - {id: e1, lane: 1, type: end, label: Процесс завершён}
  artifacts:
    s: [Задача (тип = процесс)]
    t1: [Run (pending), запись истории «шаг»]
    t2: [RunBundle, RunEvent]
    t3: [ApprovalDecision]
    t4: [RunResult, комментарий, вложения, запись истории «переход»]
    x1: [уведомление, запись истории «ошибка шага»]
    h1: [изменения задачи]
    e1: [задача в колонке completed]
- title: Управление ходом задачи пользователем
  stories: [US-ICP-10, US-ICP-12, US-ICP-13, US-ICP-14, US-ICP-04, US-ICP-15, US-ICP-16, US-ICP-17, US-ICP-18]
  lanes: [Пользователь, ICPlan, Agent Runner / Harness]
  steps:
  - {id: s, lane: 1, type: start, label: Шаг завершён или идёт, next: [pm]}
  - {id: pm, lane: 1, type: gateway, label: 'Есть право на задачу?', next: [{to: g, label: да}, {to: x403, label: нет}]}
  - {id: x403, lane: 1, type: error, label: Нет права (403)}
  - {id: g, lane: 0, type: gateway, label: 'Что делает пользователь?', next: [{to: ca, label: указание}, {to: st, label: остановить}, {to: rv, label: проверка}, {to: rp, label: повтор / передать}, {to: sv, label: сводка}]}
  - {id: ca, lane: 1, type: gateway, label: 'Запуск ещё идёт?', next: [{to: ch, label: да}, {to: x409, label: нет}]}
  - {id: x409, lane: 1, type: error, label: 'Запуск завершён (409): указание — новым запуском'}
  - {id: ch, lane: 2, type: task, label: Указание в активный запуск, next: [e]}
  - {id: st, lane: 1, type: task, label: 'Остановить процесс, отменить запуск', next: [e]}
  - {id: rv, lane: 1, type: gateway, label: Вердикт, next: [{to: ok, label: принято}, {to: 'no', label: не выполнено}]}
  - {id: ok, lane: 1, type: task, label: Переход при успехе, next: [e]}
  - {id: 'no', lane: 2, type: task, label: Повтор шага с заметкой, next: [e]}
  - {id: rp, lane: 1, type: gateway, label: 'Повтор возможен?', next: [{to: rpd, label: да}, {to: rpx, label: нет}]}
  - {id: rpx, lane: 1, type: error, label: Лимит шага или процесс остановлен (409)}
  - {id: rpd, lane: 1, type: task, label: Повтор / с шага N / другой исполнитель, next: [e]}
  - {id: sv, lane: 0, type: task, label: 'Сводка: в работе, время, $; почему не берут', next: [e]}
  - {id: e, lane: 1, type: end, label: Ход задачи изменён}
  artifacts:
    ch: ['сообщение, прикреплённое к запуску']
    st: [флаг `process_paused`, запуск canceled]
    ok: [запись истории «принято»]
    'no': [заметка возврата, новый Run]
    rpd: [новый Run, запись истории]
    sv: [сводка (3.9)]
- title: 'Агент: создать, проверить, изменить, выключить, удалить'
  stories: [US-ICP-20, US-ICP-24, US-ICP-21, US-ICP-22, US-ICP-23, US-ICP-28, US-ICP-06]
  lanes: [Администратор, ICPlan, Agent Runner]
  steps:
  - {id: s, lane: 0, type: start, label: Нужен агент, next: [cr]}
  - {id: cr, lane: 1, type: task, label: Создать агента (external), next: [vl]}
  - {id: vl, lane: 1, type: gateway, label: 'Связи верны?', next: [{to: ts, label: да}, {to: x, label: нет}]}
  - {id: x, lane: 0, type: error, label: Ошибка поля}
  - {id: ts, lane: 2, type: task, label: Проверка в чате (mock), next: ['on']}
  - {id: 'on', lane: 2, type: gateway, label: 'Runner в сети?', next: [{to: wk, label: да}, {to: of, label: нет}]}
  - {id: of, lane: 1, type: task, label: Статус «не в сети», next: [wk]}
  - {id: wk, lane: 1, type: task, label: 'Работа, статистика', next: [ch]}
  - {id: ch, lane: 0, type: gateway, label: Действие администратора, next: [{to: ed, label: изменить}, {to: ds, label: выключить}, {to: da, label: удалить}]}
  - {id: da, lane: 1, type: gateway, label: 'Есть активные запуски?', next: [{to: wr, label: да}, {to: dl, label: нет}]}
  - {id: wr, lane: 0, type: task, label: Предупреждение; после подтверждения запуски отменены, next: [dl]}
  - {id: ed, lane: 1, type: task, label: Новая версия, next: [e]}
  - {id: ds, lane: 1, type: task, label: 'Выключен: очередь ждёт', next: [e]}
  - {id: dl, lane: 1, type: task, label: 'Удалён: шаги ручные', next: [e]}
  - {id: e, lane: 1, type: end, label: Агент обновлён}
  artifacts:
    cr: [определение агента, ключ агента]
    ts: [тестовый тред чата]
    wk: [статистика агента]
    ed: [версия определения]
    ds: ['`agent.enabled = false`']
    dl: [шаги процессов без агента]
- title: 'Процесс: создать, изменить, подключить агента, Действие'
  stories: [US-ICP-05, US-ICP-25, US-ICP-26, US-ICP-27]
  lanes: [Администратор, ICPlan]
  steps:
  - {id: s, lane: 0, type: start, label: Нужен процесс, next: [ed]}
  - {id: ed, lane: 0, type: task, label: 'Шаги, агенты, переходы', next: [vl]}
  - {id: vl, lane: 1, type: gateway, label: 'Структура верна?', next: [{to: tk, label: да}, {to: x, label: нет}]}
  - {id: x, lane: 1, type: error, label: Ошибка с шагом}
  - {id: tk, lane: 1, type: gateway, label: 'Есть задачи на удалённых шагах?', next: [{to: mv, label: да}, {to: sv, label: нет}]}
  - {id: mv, lane: 0, type: task, label: Указать шаг для переноса, next: [sv]}
  - {id: sv, lane: 1, type: task, label: Новая версия процесса, next: [na]}
  - {id: na, lane: 0, type: gateway, label: 'Нужно Действие по условию?', next: [{to: ac, label: да}, {to: e, label: нет}]}
  - {id: ac, lane: 0, type: task, label: Действие «делегировать агенту» (необязательно), next: [e]}
  - {id: e, lane: 1, type: end, label: Процесс действует}
  artifacts:
    ed: [черновик процесса]
    mv: [перенос задач]
    sv: [версия процесса]
    ac: [Действие проекта]
