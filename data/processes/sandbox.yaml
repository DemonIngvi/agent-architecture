processes:
- title: Среда запуска и сеть
  stories: [US-SBX-01, US-SBX-03]
  lanes: [Agent Runner, Sandbox, Внешние хосты]
  steps:
  - {id: s, lane: 0, type: start, label: Нужна среда, next: [g1]}
  - {id: g1, lane: 1, type: gateway, label: 'Пул не пуст?', next: [{to: t1, label: да}, {to: t0, label: нет}]}
  - {id: t0, lane: 1, type: task, label: Создать контейнер, next: [t1]}
  - {id: t1, lane: 1, type: task, label: Выдать контейнер, next: [t2]}
  - {id: t2, lane: 1, type: task, label: Исходящий запрос, next: [g2]}
  - {id: g2, lane: 2, type: gateway, label: 'В allowlist?', next: [{to: t3, label: да}, {to: x1, label: нет}]}
  - {id: x1, lane: 1, type: error, label: Блок + событие}
  - {id: t3, lane: 2, type: task, label: 'Запрос, секрет подставлен', next: [t4]}
  - {id: t4, lane: 0, type: task, label: 'Destroy, долив пула', next: [e1]}
  - {id: e1, lane: 0, type: end, label: Среда удалена}
  artifacts:
    t0: [контейнер]
    t1: [SandboxClaim]
    x1: [событие блокировки]
    t3: [журнал egress]
- title: Рабочее пространство и репозитории
  stories: [US-SBX-02, US-SBX-04, US-SBX-05, US-SBX-06, US-SBX-07]
  lanes: [Администратор, Sandbox, Агент, ICPlan]
  steps:
  - {id: s, lane: 0, type: start, label: Политика доступа, next: [pl]}
  - {id: pl, lane: 0, type: task, label: Агент × ресурс × право, next: [mf]}
  - {id: mf, lane: 1, type: task, label: Манифест workspace запуска, next: [g]}
  - {id: g, lane: 1, type: gateway, label: 'Право есть?', next: [{to: cl, label: да}, {to: x, label: нет}]}
  - {id: x, lane: 1, type: error, label: Отказ с причиной}
  - {id: cl, lane: 2, type: task, label: 'Клон, чтение прошлых шагов', next: [wr]}
  - {id: wr, lane: 2, type: task, label: Запись в свою подпапку / ветку, next: [pb]}
  - {id: pb, lane: 3, type: task, label: Вложения и PR в задаче, next: [e]}
  - {id: e, lane: 3, type: end, label: Результат доступен}
  artifacts:
    pl: [политика доступа (📌 ОВ-WS)]
    mf: [манифест workspace]
    wr: [артефакты шага]
    pb: [вложения, PR]
