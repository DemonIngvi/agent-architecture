processes:
- title: Среда запуска и сеть
  stories: [US-SBX-01, US-SBX-03]
  lanes: [Agent Runner, Sandbox, Внешние хосты]
  steps:
  - [s, 0, start, Нужна среда, [[g1, '']]]
  - [g1, 1, gateway, 'Пул не пуст?', [[t1, да], [t0, нет]]]
  - [t0, 1, task, Создать контейнер, [[t1, '']]]
  - [t1, 1, task, Выдать контейнер, [[t2, '']]]
  - [t2, 1, task, Исходящий запрос, [[g2, '']]]
  - [g2, 2, gateway, 'В allowlist?', [[t3, да], [x1, нет]]]
  - [x1, 1, error, Блок + событие, []]
  - [t3, 2, task, 'Запрос, секрет подставлен', [[t4, '']]]
  - [t4, 0, task, 'Destroy, долив пула', [[e1, '']]]
  - [e1, 0, end, Среда удалена, []]
  artifacts:
    t0: [контейнер]
    t1: [SandboxClaim]
    x1: [событие блокировки]
    t3: [журнал egress]
- title: Рабочее пространство и репозитории
  stories: [US-SBX-02, US-SBX-04, US-SBX-05, US-SBX-06, US-SBX-07]
  lanes: [Администратор, Sandbox, Агент, ICPlan]
  steps:
  - [s, 0, start, Политика доступа, [[pl, '']]]
  - [pl, 0, task, Агент × ресурс × право, [[mf, '']]]
  - [mf, 1, task, Манифест workspace запуска, [[g, '']]]
  - [g, 1, gateway, 'Право есть?', [[cl, да], [x, нет]]]
  - [x, 1, error, Отказ с причиной, []]
  - [cl, 2, task, 'Клон, чтение прошлых шагов', [[wr, '']]]
  - [wr, 2, task, Запись в свою подпапку / ветку, [[pb, '']]]
  - [pb, 3, task, Вложения и PR в задаче, [[e, '']]]
  - [e, 3, end, Результат доступен, []]
  artifacts:
    pl: [политика доступа (📌 ОВ-WS)]
    mf: [манифест workspace]
    wr: [артефакты шага]
    pb: [вложения, PR]
