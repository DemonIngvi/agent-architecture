processes:
- title: События и чат запуска
  stories: [US-OBS-01, US-OBS-03]
  lanes: [Harness / Runner, Observability, Пользователь]
  steps:
  - [s, 0, start, Шаг запуска, [[t1, '']]]
  - [t1, 1, task, Маскировать данные, [[t2, '']]]
  - [t2, 1, task, Записать событие, [[g1, '']]]
  - [g1, 1, gateway, 'Запись удалась?', [[t3, да], [t4, нет]]]
  - [t4, 0, task, 'Буфер, досылка', [[t2, '']]]
  - [t3, 2, task, Чат запуска и затраты, [[g2, '']]]
  - [g2, 2, gateway, 'Цена модели задана?', [[e1, да], [x1, нет]]]
  - [x1, 1, error, 'Цены нет: токены учтены, стоимость «неизвестна»', []]
  - [e1, 2, end, Пользователь видит, []]
  artifacts:
    t1: [замаскированное событие]
    t2: [RunEvent]
    t4: [буфер событий]
    t3: [чат запуска, агрегат затрат]
    x1: [агрегат затрат без стоимости]
- title: Разбор задачи, трасса, польза агентов
  stories: [US-OBS-02, US-OBS-04, US-OBS-05]
  lanes: [Администратор / Эксплуатация / Владелец продукта, Observability]
  steps:
  - [s, 0, start, Вопрос о работе агентов, [[g, '']]]
  - [g, 0, gateway, 'Что нужно?', [[rn, разбор задачи], [tr, сбой], [pv, польза]]]
  - [rn, 1, task, 'Запуски, версии, итоги', [[g2, '']]]
  - [tr, 1, task, Трасса Runner → Harness → LiteLLM, [[g2, '']]]
  - [g2, 1, gateway, 'События ещё хранятся?', [[e, да], [x, нет]]]
  - [x, 1, error, 'Срок `retention_days` истёк: события удалены, остались агрегаты затрат', []]
  - [pv, 1, task, 'Закрыто, возвраты, затраты', [[e, '']]]
  - [e, 0, end, Ответ получен, []]
  artifacts:
    rn: [список запусков]
    tr: [трасса]
    pv: [отчёт]
