processes:
- title: Вызов модели
  stories: [US-LLM-02, US-LLM-03, US-LLM-04]
  lanes: [Harness, LiteLLM, Провайдер / mock]
  steps:
  - {id: s, lane: 0, type: start, label: Вызов модели, next: [g1]}
  - {id: g1, lane: 1, type: gateway, label: 'Ключ, бюджет, лимит?', next: [{to: t1, label: ок}, {to: x1, label: превышен}]}
  - {id: x1, lane: 0, type: error, label: Отказ до траты}
  - {id: t1, lane: 2, type: task, label: Основная модель, next: [g2]}
  - {id: g2, lane: 1, type: gateway, label: 'Успех?', next: [{to: t3, label: да}, {to: t2, label: сбой}]}
  - {id: t2, lane: 2, type: task, label: Fallback-модель, next: [t3]}
  - {id: t3, lane: 1, type: task, label: Учёт затрат, next: [e1]}
  - {id: e1, lane: 0, type: end, label: Ответ}
  artifacts:
    t1: [запрос провайдеру]
    x1: [ошибка лимита]
    t3: [spend log]
- title: Смена модели и отчёт о затратах
  stories: [US-LLM-01, US-LLM-05]
  lanes: [Администратор / Владелец продукта, LiteLLM]
  steps:
  - {id: s, lane: 0, type: start, label: Нужна другая модель или отчёт, next: [g]}
  - {id: g, lane: 0, type: gateway, label: 'Что?', next: [{to: al, label: модель}, {to: rp, label: отчёт}]}
  - {id: al, lane: 1, type: gateway, label: 'Алиас существует?', next: [{to: ok, label: да}, {to: xe, label: нет}]}
  - {id: xe, lane: 1, type: error, label: 'Ошибка алиаса, модель не меняется'}
  - {id: ok, lane: 1, type: task, label: Алиас → новая модель, next: [e]}
  - {id: rp, lane: 1, type: task, label: 'Отчёт за период, CSV', next: [e]}
  - {id: e, lane: 1, type: end, label: Готово}
  artifacts:
    ok: ['`model_list`']
    xe: [ошибка алиаса]
    rp: [CSV затрат]
