processes:
- title: Вызов модели
  stories: [US-LLM-02, US-LLM-03, US-LLM-04]
  lanes: [Harness, LiteLLM, Провайдер / mock]
  steps:
  - [s, 0, start, Вызов модели, [[g1, '']]]
  - [g1, 1, gateway, 'Ключ, бюджет, лимит?', [[t1, ок], [x1, превышен]]]
  - [x1, 0, error, Отказ до траты, []]
  - [t1, 2, task, Основная модель, [[g2, '']]]
  - [g2, 1, gateway, 'Успех?', [[t3, да], [t2, сбой]]]
  - [t2, 2, task, Fallback-модель, [[t3, '']]]
  - [t3, 1, task, Учёт затрат, [[e1, '']]]
  - [e1, 0, end, Ответ, []]
  artifacts:
    t1: [запрос провайдеру]
    x1: [ошибка лимита]
    t3: [spend log]
- title: Смена модели и отчёт о затратах
  stories: [US-LLM-01, US-LLM-05]
  lanes: [Администратор / Владелец продукта, LiteLLM]
  steps:
  - [s, 0, start, Нужна другая модель или отчёт, [[g, '']]]
  - [g, 0, gateway, 'Что?', [[al, модель], [rp, отчёт]]]
  - [al, 1, gateway, 'Алиас существует?', [[ok, да], [xe, нет]]]
  - [xe, 1, error, 'Ошибка алиаса, модель не меняется', []]
  - [ok, 1, task, Алиас → новая модель, [[e, '']]]
  - [rp, 1, task, 'Отчёт за период, CSV', [[e, '']]]
  - [e, 1, end, Готово, []]
  artifacts:
    ok: ['`model_list`']
    xe: [ошибка алиаса]
    rp: [CSV затрат]
