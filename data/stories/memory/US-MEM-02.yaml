role: Аг
want: видеть итоги прошлых запусков задачи и заметки пользователя о возврате
so_that: учесть замечания и не повторять ошибок
accept:
- Итоги последних N запусков в контексте
- Возврат пользователем → заметка возврата в контексте
- Память недоступна → пустой контекст с предупреждением
reqs:
- {spec: agent-memory, title: История запусков в контексте}
- {spec: agent-memory, title: Автоматическая запись M1 и M2}
entry: контекст запуска
