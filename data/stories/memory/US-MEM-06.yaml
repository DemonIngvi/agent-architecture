role: П
want: чтобы агент помнил нашу переписку по задаче и в чате (M1)
so_that: не повторять уже сказанное
accept:
- Каждое сообщение пользователя и агента ICPlan пишет в M1 автоматически
- Новый запуск по задаче получает переписку, если M1 в профиле чтения
- Переписка старше срока M1 не отдаётся агенту; треды удаляет ICPlan по `chat.retention_days` (D25)
reqs:
- {spec: agent-memory, title: Автоматическая запись M1 и M2}
- {spec: agent-memory, title: Срок хранения}
- {spec: agent-memory, title: Проверки записи в память}
entry: чат агента, комментарии задачи
