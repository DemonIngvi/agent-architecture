role: Аг
want: забрать запуск из очереди и исполнить его в изолированной среде
so_that: задача ICPlan выполнялась агентом платформы
accept:
- Запуск взят → создан sandbox, Harness получил задание
- Агент выключен или нет настроек → `agent_unavailable`, sandbox не создаётся
- Нет свободного слота → запуск ждёт в `queued`
reqs:
- 'agent-runner: Запуск из очереди ICPlan'
- 'agent-runner: Статусы запуска'
- 'agent-runner: Возврат результата'
entry: очередь ICPlan
