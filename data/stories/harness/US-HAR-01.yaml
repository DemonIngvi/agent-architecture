role: Аг
want: выполнить задачу по инструкции, используя модель и тулы
so_that: дать пользователю результат
accept:
- Цикл модель → тулы → итог
- Тул вернул ошибку → агент учитывает и продолжает
- Модель недоступна → fallback или завершение `error` с причиной
reqs:
- 'agent-harness: Агентский цикл'
- 'agent-harness: Инициализация из определения агента'
- 'tool-integration: MCP-сервер ICPlan'
entry: задание `RunBundle`
