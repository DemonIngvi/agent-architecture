role: Аг
want: брать следующую задачу из своей очереди по всем процессам, где я исполнитель шага
so_that: работать без ручной раздачи и не брать одну задачу дважды
accept:
- 'Порядок очереди: приоритет задачи, затем время постановки'
- У задачи не более одного активного запуска
- Runner пропал → по истечении аренды запуск снова в голове очереди
reqs:
- {spec: icplan-agent-autopickup, title: Очередь агента}
- {spec: icplan-integration, title: Однократная выдача запуска}
entry: очередь запусков (Runner)
chain:
  path: [US-ICP-07, US-RUN-03, US-RUN-01]
  end: запуск выдан одному Runner с арендой
