role: А
want: подключить агента к шагу процесса или отключить
so_that: менять исполнителя шага без пересоздания процесса
accept:
- Подключил → следующие входы в шаг запускают агента
- Отключил → шаг ручной, активные запуски доделываются
- Агент не участник проекта → подключение отклонено
reqs:
- {spec: icplan-agent-autopickup, title: Агент шага процесса}
- {spec: icplan-agent-autopickup, title: Очистка при выходе агента из проекта}
entry: Настройки проекта → Процессы → шаг
chain:
  path: [US-ICP-26, US-PM-05]
  end: следующий вход задачи в шаг запускает агента
