role: А
want: проверить агента на тестовой задаче до подключения к процессу
so_that: не запускать в работу непроверенного агента
accept:
- Тестовый запуск на выбранной задаче или примере → итог и шаги видны, задача не меняется
- Можно выбрать mock-модель → без затрат
- Тест упал → видно на каком шаге и почему
reqs:
- 'icplan-integration: Проверка агента в чате'
- 'llm-gateway: Mock-модель для разработки'
- 'agent-harness: Стрим шагов'
entry: агент → «проверить»
chain:
  path: [US-ICP-24, US-LLM-02, US-HAR-01]
  end: итог теста в чате; задачи не изменены
