role: А
want: изменить настройки агента
so_that: улучшить агента, не ломая идущую работу
accept:
- Изменение → новая версия, действует со следующего запуска
- Активные запуски доделываются на старой версии
- Ошибка в настройке → версия не сохраняется, прежняя действует
- 'Граница MVP: версии агента входят в MVP — запуск закрепляет версию на старте (последнюю или указанную задачей, `Run.settingsVersionId`); несуществующая версия — отказ; история и откат настроек в интерфейсе — этап 4, задача 4.4 (R-REG-03, Z-ICP-106, решение владельца 2026-10-14)'
reqs:
- {spec: control-plane, title: Применение к следующему запуску}
- {spec: agent-registry, title: Версионирование}
entry: Команда → ИИ-агенты → агент
chain:
  path: [US-ICP-21, US-PM-02, US-MEM-07]
  end: новая версия агента действует со следующего запуска
