role: А
want: изменить настройки агента
so_that: улучшить агента, не ломая идущую работу
accept:
- Изменение → новая версия, действует со следующего запуска
- Активные запуски доделываются на старой версии
- Ошибка в настройке → версия не сохраняется, прежняя действует
reqs:
- 'control-plane: Применение к следующему запуску'
- 'agent-registry: Версионирование'
entry: Команда → ИИ-агенты → агент
chain:
  path: [US-ICP-21, US-PM-02, US-MEM-07]
  end: новая версия агента действует со следующего запуска
