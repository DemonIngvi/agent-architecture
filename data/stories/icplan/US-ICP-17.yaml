role: П
want: передать текущий шаг задачи другому агенту или человеку
so_that: исправить неудачный выбор исполнителя для этой задачи
accept:
- Выбрал другого агента → активный запуск отменён, запуск нового агента на том же шаге
- Выбрал человека → делегат снят, исполнитель — человек, шаг ручной для задачи
- Процесс для других задач не меняется
reqs:
- 'icplan-agent-autopickup: Приоритет правил'
entry: 'карточка задачи: поле «делегат» / «исполнитель»'
chain:
  path: [US-ICP-17, US-ICP-07, US-RUN-01]
  end: шаг выполняет новый исполнитель; процесс для других задач не изменён
