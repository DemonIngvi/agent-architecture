role: П
want: создать задачу нужного типа и чтобы она сама прошла шаги процесса с агентами
so_that: не делегировать и не переводить задачу вручную на каждом этапе
accept:
- Задача вошла в шаг с агентом → агент — делегат, запуск в его очереди
- Успех запуска → ICPlan переводит задачу на следующий шаг
- Ошибка или непройденный quality gate → переход при ошибке, уведомление владельцу процесса
- Ручной шаг → задача ждёт человека
- Лимит запусков на шаге превышен → переход при ошибке
- Повторный вход в шаг при активном запуске → второго запуска нет
reqs:
- 'icplan-agent-autopickup: Агент шага процесса'
- 'icplan-agent-autopickup: Переход по итогу запуска'
- 'icplan-agent-autopickup: Защита от дублей'
- 'icplan-agent-autopickup: Поведение при отказах зависимостей'
entry: 'создание задачи: доска, Telegram-бот, API; перевод в колонку'
chain:
  path: [US-ICP-01, US-ICP-07, US-GRD-03, US-RUN-01, US-SBX-01, US-SBX-05, US-MEM-07, US-MEM-01, US-HAR-01, US-MCP-02, US-LLM-03, US-OBS-01, US-ICP-02]
  end: итог в задаче; ICPlan переводит задачу на следующий шаг процесса или в «ждёт проверки» (US-ICP-13)
