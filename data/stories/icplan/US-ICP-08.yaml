role: П
want: сам поручить задачу конкретному агенту, минуя процесс
so_that: быстро отдать разовую работу нужному агенту
accept:
- Выбрал агента в поле «делегат» → запуск в очереди этого агента
- Задача в процессе → явный делегат важнее агента шага, шаг не меняется
- Агент выключен или не в проекте → делегат не ставится, причина в карточке
reqs:
- 'icplan-agent-autopickup: Приоритет правил'
- 'icplan-integration: Получение запуска из очереди (pull)'
- 'agent-runner: Запуск из очереди ICPlan'
- 'icplan-agent-autopickup: Триггеры запуска ICPlan'
entry: 'карточка задачи: поле «делегат»'
chain:
  path: [US-ICP-08, US-ICP-07, US-RUN-01, US-HAR-01, US-OBS-01]
  end: итог комментарием в задаче, делегат снят
