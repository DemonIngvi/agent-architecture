role: П
want: ответить на вопрос агента
so_that: агент продолжил работу, а не ждал или гадал
accept:
- Агент задал вопрос → задача «ждёт ответа», уведомление исполнителю
- Ответ в чате, комментарии или Telegram → агент продолжает с ответом
- Нет ответа дольше таймаута → переход при ошибке с причиной «нет ответа»
reqs:
- {spec: icplan-integration, title: Подтверждения и ответы}
- {spec: icplan-integration, title: Уведомление о решении пользователя}
- {spec: agent-harness, title: Пауза и возобновление}
entry: уведомление; чат; комментарий; Telegram-бот
chain:
  path: [US-ICP-11, US-ICP-03, US-HAR-07, US-MEM-06]
  end: агент продолжает работу с ответом в контексте
