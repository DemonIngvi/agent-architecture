role: П
want: отменить текущую работу агента
so_that: остановить неверное направление и траты
accept:
- Отмена активного запуска → `canceled`, среда уничтожена
- Отмена в очереди → запуск снят без среды
- Отмена завершённого → без изменений
reqs:
- 'icplan-integration: Отмена из ICPlan'
- 'agent-runner: Отмена запуска'
entry: карточка задачи, чат
chain:
  path: [US-ICP-04, US-RUN-01, US-SBX-01, US-OBS-01]
  end: запуск `canceled`, среда уничтожена, запись в истории
