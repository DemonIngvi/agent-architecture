role: П
want: задать агенту вопрос или поручение упоминанием в комментарии
so_that: не открывать отдельный экран и не менять делегата
accept:
- '`@агент` в комментарии → запуск, ответ — комментарием в той же ветке'
- Упомянут агент без доступа к проекту → ответ «нет доступа», запуска нет
- Упоминание при активном запуске этого агента по задаче → сообщение попадает в текущий запуск, второго нет
reqs:
- 'icplan-integration: Получение запуска из очереди (pull)'
- 'icplan-integration: Стрим шагов и итог в задачу'
- 'agent-runner: Один запуск на задачу'
- 'icplan-agent-autopickup: Триггеры запуска ICPlan'
entry: комментарий с упоминанием
chain:
  path: [US-ICP-09, US-RUN-01, US-MEM-06, US-HAR-01]
  end: ответ агента в ветке комментария
