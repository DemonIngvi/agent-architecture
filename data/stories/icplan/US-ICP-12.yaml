role: П
want: 'видеть сводку по своим задачам с агентами: что выполняется и в очереди, сколько идёт, сколько открыто и закрыто, сколько потрачено токенов и денег'
so_that: понимать загрузку, сроки и стоимость без открытия каждой задачи
accept:
- 'Сводка: в работе, в очереди, ждут меня, закрыто, открыто — с фильтром по проекту и периоду'
- 'У задачи: время в работе агента и в ожидании человека, токены и $'
- Нет запусков за период → пустая сводка с пояснением
- Данные затрат недоступны (LiteLLM) → показываются без затрат с пометкой
reqs:
- {spec: observability, title: Сводка и статистика агентов}
- {spec: observability, title: Затраты}
- {spec: observability, title: События запуска}
entry: дашборд проекта; «Мои задачи»
chain:
  path: [US-ICP-12, US-LLM-03, US-OBS-05]
  end: сводка показана; переход к задаче — US-ICP-02
