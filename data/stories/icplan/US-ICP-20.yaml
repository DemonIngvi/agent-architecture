role: А
want: 'создать ИИ-агента платформы: имя, модель, инструкция, тулы, навыки, MCP, проекты'
so_that: агент появился в ICPlan и мог получать задачи
accept:
- Агент сохранён → виден в проектах, Runner получает его запуски
- Ссылка на несуществующий тул или модель → сохранение отклонено с полем
- Runner не в сети → агент создан, статус «не в сети»
reqs:
- {spec: agent-registry, title: Определение агента}
- {spec: agent-registry, title: Валидация связей}
- {spec: agent-registry, title: Каталог ресурсов}
- {spec: icplan-integration, title: Каталог агентов платформы}
- {spec: icplan-integration, title: Агент платформы как внешний агент ICPlan}
entry: Команда → ИИ-агенты
chain:
  path: [US-ICP-20, US-PM-01, US-MCP-01, US-ICP-24]
  end: агент создан и проверен; подключение к шагу — US-ICP-26
