role: А
want: 'создать процесс для типа задачи: шаги-колонки, агенты, переходы при успехе и ошибке, следующий процесс'
so_that: процесс работал без кода и однозначно
accept:
- Процесс сохраняется, у каждого шага одна колонка и явные переходы
- Ошибка структуры (несуществующий шаг, повтор колонки, недостижимый шаг) → сохранение отклонено с причиной
- Переход в другой процесс → тип задачи меняется, задача на первом шаге нового процесса
- Конфликт правил → явный делегат → шаг процесса → Действие
reqs:
- {spec: icplan-agent-autopickup, title: Определение процесса}
- {spec: icplan-agent-autopickup, title: Тип задачи задаёт процесс}
- {spec: icplan-agent-autopickup, title: Приоритет правил}
entry: Настройки проекта → Процессы
chain:
  path: [US-ICP-05, US-ICP-26, US-ICP-27]
  end: процесс действует для новых задач этого типа
