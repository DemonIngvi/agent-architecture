role: А
want: выключить агента и включить обратно
so_that: временно убрать агента из работы без удаления настроек
accept:
- Выключен → новые запуски не создаются, задачи шагов с ним ждут с причиной «агент выключен»
- Активные запуски доделываются или отменяются — по выбору при выключении
- Включён → ожидающие задачи встают в очередь
reqs:
- 'icplan-integration: Выключение агента'
- 'agent-runner: Запуск из очереди ICPlan'
entry: Команда → ИИ-агенты
chain:
  path: [US-ICP-22, US-RUN-01]
  end: новые запуски не создаются, очередь ждёт включения
