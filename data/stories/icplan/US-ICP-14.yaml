role: П
want: остановить процесс по задаче и при необходимости возобновить
so_that: агенты не продолжали работу, пока я разбираюсь
accept:
- «Остановить процесс» → активный запуск отменён, новые шаги не запускаются
- Задачу можно двигать вручную, агенты шагов не срабатывают
- «Возобновить» → запуск агента текущего шага
- Остановленная задача видна в сводке как «остановлена»
reqs:
- {spec: icplan-integration, title: Отмена из ICPlan}
- {spec: icplan-agent-autopickup, title: Остановка и возобновление процесса по задаче}
entry: карточка задачи; сводка
chain:
  path: [US-ICP-14, US-ICP-04, US-SBX-01]
  end: процесс остановлен, среда уничтожена; «возобновить» → запуск текущего шага (US-ICP-01)
