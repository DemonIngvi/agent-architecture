role: П
want: поставить агенту регулярную работу по расписанию
so_that: получать повторяющийся результат (отчёт, сверку) без ручного запуска
accept:
- Расписание агента сработало → запуск в очереди, итог в задаче расписания
- Предыдущий запуск ещё идёт → новый не создаётся, запись «пропущено»
- Агент выключен → срабатывание пропущено с записью в истории
- Изменил расписание → следующие срабатывания по новому расписанию; поставил на паузу (`paused`) → срабатываний нет до возобновления; удалил → запуски по нему больше не создаются, история остаётся
reqs:
- {spec: icplan-integration, title: Получение запуска из очереди (pull)}
- {spec: agent-runner, title: Один запуск на задачу}
- {spec: icplan-agent-autopickup, title: Триггеры запуска ICPlan}
entry: 'настройки агента: расписание (`agent_schedule`)'
chain:
  path: [US-ICP-19, US-RUN-01, US-HAR-01, US-OBS-01]
  end: итог в задаче расписания; следующее срабатывание — по расписанию
