role: А
want: настроить Действие «делегировать агенту» по условию
so_that: отдавать агенту задачи по признакам, которых нет в процессе (метка, поле)
accept:
- Условие выполнено → агент — делегат, запуск в очереди
- Условие не выполнено → ничего
- Агент выключен → запуска нет, ошибка в истории задачи
- Изменил или удалил Действие → новые срабатывания по новым правилам или их нет; уже созданные запуски не меняются
reqs:
- 'icplan-agent-autopickup: Эффект Действия «делегировать агенту»'
entry: Настройки проекта → Действия
chain:
  path: [US-ICP-27, US-ICP-07, US-RUN-01]
  end: задача у агента по условию Действия
