role: П
want: повторить шаг после ошибки или перезапустить задачу с выбранного шага
so_that: не создавать задачу заново
accept:
- «Повторить шаг» → новый запуск агента шага с итогом ошибки в контексте
- «Начать с шага N» → задача в колонке шага N, запуск его агента
- Лимит запусков шага исчерпан → повтор только владельцем процесса
reqs:
- 'icplan-agent-autopickup: Переход по итогу запуска'
- 'icplan-agent-autopickup: Передача результата следующему этапу'
- 'icplan-agent-autopickup: Повтор шага'
entry: карточка задачи
chain:
  path: [US-ICP-16, US-ICP-07, US-RUN-01, US-MEM-02, US-HAR-01]
  end: новый запуск шага с итогом ошибки в контексте
