role: П
want: принять результат агента или вернуть его с заметкой, что не выполнено
so_that: результат шёл дальше только после моей оценки, а агент учитывал замечания
accept:
- «Принято» → переход при успехе
- «Не выполнено» с заметкой → задача возвращается на тот же шаг, заметка — в задании следующего запуска
- Возвратов больше лимита шага → переход при ошибке, владельцу процесса
- Оценка без прав (не исполнитель и не владелец) → недоступна
reqs:
- 'icplan-agent-autopickup: Вердикт по результату'
- 'icplan-agent-autopickup: Проверка пользователем перед переходом'
entry: 'карточка задачи: кнопки «принято / не выполнено»; чат'
chain:
  path: [US-ICP-13, US-MEM-02, US-ICP-07]
  end: «принято» → следующий шаг; «не выполнено» → новый запуск шага с заметкой (цепочка US-ICP-01)
