role: Аг
want: 'получить полный контекст задачи: описание, комментарии, вложения, итог прошлого шага, заметки пользователя'
so_that: продолжать работу, а не начинать заново
accept:
- Задание содержит ссылки на итог прошлого шага и заметку возврата
- Нет прошлых запусков → задание без них
- Вложение недоступно → в задании пометка, работа продолжается
reqs:
- {spec: icplan-agent-autopickup, title: Передача результата следующему этапу}
- {spec: agent-memory, title: История запусков в контексте}
- {spec: tool-integration, title: MCP-сервер ICPlan}
entry: задание запуска (`Run`)
chain:
  path: [US-ICP-29, US-MEM-01, US-MEM-02, US-MEM-08, US-MCP-02]
  end: агент начал работу с полным контекстом задачи
