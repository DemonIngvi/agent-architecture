role: Э
want: мгновенно остановить агента или всю платформу
so_that: остановить инцидент
accept:
- Стоп агента → его запуски отменены, новые отклоняются
- Стоп всех → все запуски отменены
- Снятие стопа → работа возобновляется
reqs:
- 'guardrails: Аварийная остановка'
entry: команда эксплуатации (API kill switch) / карточка агента или God mode → «Платформа»
