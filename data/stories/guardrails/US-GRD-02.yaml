role: П
want: понимать, почему агенту отказали
so_that: исправить задачу или попросить доступ
accept:
- Отказ → причина и правило в чате запуска в задаче
- Отказ по бюджету → «бюджет исчерпан»
- Отказ OPA недоступен → «проверка недоступна, действие запрещено»
reqs:
- {spec: guardrails, title: Аудит срабатываний}
- {spec: guardrails, title: Движок решений для G1 и G2}
entry: чат запуска в задаче
