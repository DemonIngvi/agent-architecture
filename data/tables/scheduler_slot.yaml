kind: platform
store: S3
owner: agent-runner
schema: itsaplan.runner
columns:
- {name: slot_key, type: text, pk: true, desc: 'global:N / agent:<id> / model:<alias> / issue:<id>'}
- {name: run_id, type: int, fk: agent_run}
- {name: runner_id, type: text, desc: экземпляр Runner}
- {name: lease_until, type: timestamptz, desc: аренда слота}
- {name: acquired_at, type: timestamptz}
policy:
  indexes:
  - {kind: index, columns: [run_id], why: FK; освобождение по запуску}
  - {kind: index, columns: [lease_until], why: забор просроченных аренд}
  retention: на время аренды
  cleanup: строка удаляется при освобождении; просроченная аренда (`lease_until`) забирается
  migrate: runner
