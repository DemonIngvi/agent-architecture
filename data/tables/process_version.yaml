kind: platform
store: S1
owner: icplan
schema: itsaplan.public
columns:
- {name: process_id, type: int, pk: true, fk: process}
- {name: version, type: int, pk: true, desc: версия процесса}
- {name: steps, type: jsonb, desc: 'снимок шагов: задача дорабатывает шаг по версии, с которой вошла', reqs: [R-AP-22]}
- {name: created_at, type: timestamptz}
policy:
  indexes: []
  retention: пока жив процесс
  cleanup: каскадно с процессом
  migrate: fork
