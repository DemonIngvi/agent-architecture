kind: platform
store: S2
owner: platform-module
schema: itsaplan.platform
columns:
- {name: id, type: serial, pk: true}
- {name: name, type: text, desc: 'light, coder…'}
- {name: image, type: text}
- {name: runtime, type: text, desc: runc / runsc}
- {name: cpu, type: numeric}
- {name: memory_mb, type: int}
- {name: disk_gb, type: int}
- {name: egress_allow, type: jsonb}
- {name: pool_size, type: int}
policy:
  indexes:
  - {kind: unique, columns: [name], why: профиль по имени}
  retention: бессрочно (справочник)
  cleanup: удаление запрещено, пока профиль используется
  migrate: cp
