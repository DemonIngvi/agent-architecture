kind: platform
store: S3
owner: observability
schema: itsaplan.platform
columns:
- {name: run_id, type: int, pk: true, fk: agent_run, desc: 'целое, как `agent_run.id`'}
- {name: seq, type: int, pk: true}
- {name: ts, type: timestamptz}
- {name: type, type: text, desc: '`event.type` AG-UI, для отбора'}
- {name: event, type: jsonb, desc: 'событие AG-UI целиком, маскированное; дельты собраны в сообщение'}
- {name: issue_id, type: int, fk: issue, desc: лента задачи}
policy:
  indexes:
  - {kind: index, columns: [ts], why: очистка по сроку}
  - {kind: index, columns: [issue_id, ts], why: лента задачи}
  retention: '`retention_days` = 90 (observability)'
  cleanup: ночная пакетная очистка по `ts`; при медленной очистке (этап 4) — секции по дням
  migrate: obs
