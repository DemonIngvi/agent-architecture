kind: platform
store: S1
owner: icplan
schema: itsaplan.public
columns:
- {name: id, type: serial, pk: true}
- {name: project_id, type: int, fk: project}
- {name: issue_type_id, type: int, fk: issue_type, desc: один процесс на тип}
- {name: owner_user_id, type: text, desc: владелец}
- {name: first_step_id, type: int, fk: process_step}
- {name: version, type: int, desc: версия процесса}
policy:
  indexes:
  - {kind: unique, columns: [project_id, issue_type_id], why: один процесс на тип задачи}
  - {kind: index, columns: [issue_type_id], why: FK; процесс по типу задачи}
  - {kind: index, columns: [first_step_id], why: FK}
  retention: пока жив проект
  cleanup: каскадно с проектом; версия процесса растёт при правке
  migrate: fork
