kind: platform
store: S3
owner: agent-runner
schema: itsaplan.runner
columns:
- {name: lock_hash, type: text, pk: true, desc: хеш lock-файлов}
- {name: project_id, type: int, fk: project}
- {name: path, type: text, desc: том кэша}
- {name: created_at, type: timestamptz}
- {name: expires_at, type: timestamptz, desc: '`setup.cache_ttl_h`'}
policy:
  indexes:
  - {kind: index, columns: [project_id], why: FK}
  - {kind: index, columns: [expires_at], why: очистка}
  retention: '`setup.cache_ttl_h` = 168 (agent-sandbox)'
  cleanup: очистка по `expires_at` вместе с томом кэша
  migrate: runner
