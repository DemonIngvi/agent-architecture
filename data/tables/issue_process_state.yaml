kind: platform
store: S1
owner: icplan
schema: itsaplan.public
columns:
- {name: issue_id, type: int, pk: true, fk: issue}
- {name: process_id, type: int, fk: process}
- {name: process_version, type: int, desc: 'составной FK (`process_id`, `process_version`) → `process_version`, индекс по этой паре; версия процесса, с которой задача вошла в текущий шаг: шаг дорабатывается по снимку этой версии', reqs: [R-AP-22]}
- {name: step_id, type: int, fk: process_step, desc: текущий шаг}
- {name: runs_on_step, type: int, desc: счётчик для `max_runs`}
- {name: state, type: text, desc: running / waiting_review / paused / done}
- {name: last_verdict, type: text, desc: accepted / rejected}
- {name: updated_at, type: timestamptz}
policy:
  indexes:
  - {kind: index, columns: [process_id, process_version], why: FK; задачи на версии процесса}
  - {kind: index, columns: [step_id, state], why: задачи на шаге — доска и подхват}
  retention: пока жива задача
  cleanup: каскадно с задачей
  migrate: fork
