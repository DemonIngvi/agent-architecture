kind: platform
store: S2
owner: platform-module
schema: itsaplan.platform
columns:
- {name: scope, type: text, pk: true, desc: 'platform / agent:<id>'}
- {name: enabled, type: bool}
- {name: reason, type: text}
- {name: by, type: text}
- {name: at, type: timestamptz}
policy:
  indexes: []
  retention: бессрочно (текущее состояние)
  cleanup: история переключений — в аудите guardrails
  migrate: cp
