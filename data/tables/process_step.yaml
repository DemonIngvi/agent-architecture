kind: platform
store: S1
owner: icplan
schema: itsaplan.public
columns:
- {name: id, type: serial, pk: true}
- {name: key, type: text, desc: ключ шага в процессе (`sdd`) — `ProcessStep.id`}
- {name: process_id, type: int, fk: process}
- {name: column_id, type: int, fk: project_column, desc: колонка}
- {name: agent_id, type: int, fk: ai_agent, desc: нет — ручной шаг}
- {name: on_success, type: jsonb, desc: шаг / процесс / завершить}
- {name: on_failure, type: jsonb}
- {name: max_runs, type: int, desc: '3'}
- {name: require_review, type: bool}
- {name: deliverable, type: text, desc: результат шага, decisions: [D20]}
- {name: done_criteria, type: jsonb, desc: готовность шага, decisions: [D20]}
- {name: criteria_approval, type: text, desc: auto / review / always}
policy:
  indexes:
  - {kind: unique, columns: [process_id, key], why: ключ шага уникален в процессе}
  - {kind: unique, columns: [process_id, column_id], why: одна колонка — один шаг}
  - {kind: index, columns: [column_id], why: FK; переход по колонке}
  - {kind: index, columns: [agent_id], why: FK; шаги агента}
  retention: пока жив процесс
  cleanup: каскадно с процессом
  migrate: fork
