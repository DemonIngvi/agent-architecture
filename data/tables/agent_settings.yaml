kind: platform
store: S2
owner: platform-module
schema: itsaplan.platform
columns:
- {name: agent_id, type: int, pk: true, fk: ai_agent}
- {name: version, type: int, desc: текущая версия}
- {name: autonomy_level, type: text, desc: R0–R5}
- {name: budget_run_usd, type: numeric}
- {name: budget_day_usd, type: numeric}
- {name: sandbox_profile_id, type: int, fk: sandbox_profile}
- {name: memory_profile_id, type: int, fk: memory_profile}
- {name: tools_allow, type: jsonb}
- {name: approval_tools, type: jsonb}
- {name: scheduling, type: jsonb, desc: 'parallel, max'}
- {name: learning, type: jsonb, desc: 'режимы обучения по видам (off|suggest|apply_gated), по умолчанию off'}
- {name: snapshots, type: jsonb, desc: 'снимки: enabled, schedule, retentionDays'}
- {name: toolsmith, type: bool, desc: агент-инструментальщик вкл/выкл}
- {name: guardrails, type: jsonb, desc: 'набор О1–О15: включение и параметры'}
- {name: updated_by, type: text}
- {name: updated_at, type: timestamptz}
policy:
  indexes:
  - {kind: index, columns: [sandbox_profile_id], why: FK}
  - {kind: index, columns: [memory_profile_id], why: FK}
  retention: пока жив агент
  cleanup: каскадно с агентом
  migrate: cp
