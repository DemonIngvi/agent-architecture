kind: platform
store: S1
owner: icplan
schema: itsaplan.public
columns:
- {name: id, type: serial, pk: true}
- {name: run_id, type: int, fk: agent_run, desc: запуск}
- {name: kind, type: text, desc: approval · message}
- {name: seq, type: int, desc: событие запроса подтверждения (для approval)}
- {name: payload, type: jsonb, desc: '`ApprovalDecision` или `UserMessage`'}
- {name: created_at, type: timestamptz}
- {name: delivered_at, type: timestamptz, desc: 'Runner подтвердил получение: `decision_applied` · `message_received`', reqs: [R-ICP-16]}
policy:
  indexes:
  - {kind: index, columns: [run_id], why: FK; недоставленное по запуску}
  - {kind: index, columns: [delivered_at], why: выборка недоставленного}
  retention: пока жив запуск
  cleanup: каскадно с `agent_run`; доставленное — со сроком `agent_run`
  migrate: fork
