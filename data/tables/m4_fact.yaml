kind: platform
store: S4
owner: memory
schema: itsaplan.memory
columns:
- {name: id, type: bigserial, pk: true, desc: после MVP}
- {name: scope, type: text}
- {name: text, type: text, desc: маскированный}
- {name: embedding, type: vector, desc: pgvector}
- {name: source, type: text}
- {name: valid_from, type: timestamptz}
- {name: valid_to, type: timestamptz}
- {name: superseded_by, type: bigint, fk: m4_fact}
policy:
  indexes:
  - {kind: index, columns: [superseded_by], why: FK}
  - {kind: index, columns: [scope, valid_to], why: действующие факты области}
  - {kind: hnsw, columns: [embedding], why: поиск похожих (pgvector)}
  retention: '`memory.retention`: M4 до замены факта (agent-memory)'
  cleanup: заменённый факт получает `valid_to`, удаляется по профилю
  migrate: memory
