kind: platform
store: S4
owner: memory
schema: itsaplan.memory
columns:
- [id, bigserial, PK, после MVP]
- [scope, text, '', '']
- [text, text, '', маскированный]
- [embedding, vector, '', pgvector]
- [source, text, '', '']
- [valid_from, timestamptz, '', '']
- [valid_to, timestamptz, '', '']
- [superseded_by, bigint, FK m4_fact, '']
policy:
  indexes:
  - [index, superseded_by, FK]
  - [index, 'scope, valid_to', действующие факты области]
  - [hnsw, embedding, поиск похожих (pgvector)]
  retention: '`memory.retention`: M4 до замены факта (agent-memory)'
  cleanup: заменённый факт получает `valid_to`, удаляется по профилю
  migrate: memory
