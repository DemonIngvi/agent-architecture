kind: platform
store: S4
owner: memory
schema: itsaplan.memory
columns:
- {name: issue_id, type: int, pk: true, fk: issue}
- {name: scope, type: text, pk: true}
- {name: agent, type: text, desc: автор}
- {name: done, type: jsonb}
- {name: next, type: jsonb}
- {name: blockers, type: jsonb}
- {name: artifacts, type: jsonb, decisions: [D20]}
- {name: questions, type: jsonb, decisions: [D20]}
- {name: criteria_next, type: jsonb, decisions: [D20]}
- {name: version, type: int}
- {name: updated_at, type: timestamptz}
policy:
  indexes: []
  retention: '`memory.retention`: M3 до закрытия задачи (agent-memory)'
  cleanup: удаляется по профилю после закрытия задачи; M2 остаётся
  migrate: memory
