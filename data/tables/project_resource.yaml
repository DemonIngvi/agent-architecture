kind: platform
store: S2
owner: platform-module
schema: itsaplan.platform
columns:
- {name: id, type: serial, pk: true}
- {name: project_id, type: int, fk: project}
- {name: kind, type: text, desc: git / folder / document / mcp}
- {name: ref, type: text, desc: 'адрес, префикс, id'}
- {name: name, type: text}
policy:
  indexes:
  - {kind: unique, columns: [project_id, kind, ref], why: ресурс один раз в проекте}
  retention: пока жив проект
  cleanup: каскадно с проектом
  migrate: cp
