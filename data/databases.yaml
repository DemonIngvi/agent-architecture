cluster:
  engine: PostgreSQL 17 + pgvector
  operator: CloudNativePG
  namespace: itsaplan-data
  instances: 1 (MVP, D18)
  pooler: PgBouncer (`Pooler` CloudNativePG), режим transaction
  backup: WAL и базовые копии в S3 вне площадки (`postgres.backup`)
  roles: managed roles CloudNativePG (D22)
databases:
  itsaplan:
    owner: icplan
    schemas:
      public:
        owner: icplan
        role: itsaplan
        stores: S1
        migrate: fork
        what: таблицы форка, процесс задачи
      platform:
        owner: platform-module
        role: itsaplan
        stores: S2, S3
        migrate: cp, obs
        what: настройки агентов, профили, доступы (Platform module); события запуска (Observability)
      runner:
        owner: agent-runner
        role: runner
        stores: S3
        migrate: runner
        what: слоты планировщика, кэш подготовки
      harness_ckpt:
        owner: agent-runner
        role: runner
        stores: S5
        migrate: runner
        what: checkpoint агентского цикла
      memory:
        owner: memory
        role: memory
        stores: S4
        migrate: memory
        what: M3, позже M4
  litellm:
    owner: llm-gateway
    schemas:
      public:
        owner: llm-gateway
        role: litellm
        stores: S6
        migrate: litellm
        what: virtual keys, бюджеты, журнал затрат
grants:
- {role: memory, right: SELECT, table: itsaplan.public.agent_run, why: 'M2: итоги запусков'}
- {role: memory, right: SELECT, table: itsaplan.public.agent_chat_message, why: 'M1: переписка'}
- {role: memory, right: SELECT, table: itsaplan.public.issue_activity, why: 'M1, M2: комментарии и записи «агент взял / закончил» (D25)'}
- {role: memory, right: REFERENCES, table: itsaplan.public.issue, why: FK memory_m3.issue_id}
- {role: runner, right: REFERENCES, table: itsaplan.public.agent_run, why: 'FK run_checkpoint.run_id, scheduler_slot'}
- {role: litellm_read (api ICPlan), right: SELECT, table: litellm.public.LiteLLM_SpendLogs, why: 'Observability: затраты задачи'}
migrate:
  fork: Drizzle в форке (`packages/db`), применяются до старта `api`
  cp: миграции Platform module в `api` форка, своя таблица версий, только схема `platform`
  obs: миграции Observability в `api` форка, своя таблица версий
  runner: миграции Agent Runner при старте, своя таблица версий
  memory: миграции Memory API при старте (Alembic), своя таблица версий
  litellm: миграции LiteLLM (Prisma) прямым подключением, минуя PgBouncer
